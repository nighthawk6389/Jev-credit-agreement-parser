# Tier 2 assertions: AMG Comvest Senior Lending Fund LL1 SPV, LLC / Sumitomo
# Mitsui Banking Corporation, Loan and Servicing Agreement as amended by the
# Fourth Amendment dated October 15, 2025, filed 2025-10-16 by AMG Comvest
# Senior Lending Fund as Exhibit 10.1.
#
# Out of sample: harvested from EDGAR after the split was frozen and labelled
# before the pipeline ran on it. A Fourth Amendment with the Loan and Servicing
# Agreement (dated July 16, 2024) attached as Annex I, conformed to the Fourth
# Amendment; every label is read from that conformed text. An SPV asset-backed
# financing facility: the borrower is the fund's special purpose vehicle, the
# fund is Transferor and Servicer, advances run against a borrowing base of
# eligible loans. Pricing (Applicable Spread) and the Non-Usage Fee are defined
# only by reference to the Fee Letter, so neither is labelled here, and the
# defined Floor reaches only a Benchmark Replacement, not Term SOFR, so the
# floor is not labelled either. Commitments step down on a date: $445,000,000
# during the Upsize Period (to April 15, 2026), $400,000,000 after it.

document: bdc_amg_comvest_2025
corpus_name: BDC_amg-comvest-senior-lending-fund_2025-10-16_0001193125-25-241497_d47862dex101
source: real
tier: 2

assertions:

  - id: amgc_borrower_legal_name
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: borrower.legal_name
    expect: "AMG COMVEST SENIOR LENDING FUND LL1 SPV, LLC"
    note: >
      'AMG COMVEST SENIOR LENDING FUND LL1 SPV, LLC, a Delaware limited
      liability company (together with its successors and assigns in such
      capacity'

      The conformed preamble, which defines the Borrower. The borrower is the
      SPV, not the fund: AMG COMVEST SENIOR LENDING FUND, the EDGAR filer, is
      a party only as Transferor and Servicer.

  - id: amgc_administrative_agent
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: administrative_agent.legal_name
    expect: "SUMITOMO MITSUI BANKING CORPORATION"
    note: >
      'SUMITOMO MITSUI BANKING CORPORATION, as Administrative Agent (together
      with its successors and assigns in such capacity'

      The conformed preamble. The same bank is Collateral Agent and a Lender;
      Western Alliance Trust Company, N.A. is Account Bank, Collateral
      Custodian and Collateral Administrator, not an agent for the lenders.

  - id: amgc_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      'THIS AGREEMENT SHALL, IN ACCORDANCE WITH SECTION 5-1401 OF THE GENERAL
      OBLIGATIONS LAW OF THE STATE OF NEW YORK, BE GOVERNED BY THE LAWS OF THE
      STATE OF NEW YORK.'

      Section 11.06 of the conformed agreement; the Fourth Amendment itself
      (Section 6.09) is also governed by New York law.

  - id: amgc_maturity_date
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: revolver.maturity_date
    expect: 2029-07-16
    note: >
      'means the earliest to occur of (i) the Stated Maturity Date, (ii) the
      date of the declaration, or automatic occurrence, of the Facility
      Maturity Date pursuant to Section 7.01'

      The Facility Maturity Date resolves through the Stated Maturity Date,
      which the conformed text defines as July 16, 2029 ('Stated Maturity Date
      " means July 16, 2029'); the other limbs are events with no date. Not the
      end of the Reinvestment Period (the 36-month anniversary of the July 16,
      2024 Closing Date). A one-year Stated Maturity Date Extension under
      Section 2.01(c)(ii) is at the sole discretion of the lenders and is not
      reflected.

  - id: amgc_no_leverage_covenant
    family: F04_absence
    member: no_financial_covenant
    kind: field_status
    target: financial_covenant.level
    expect: absent_from_document
    note: >
      'the BDC Asset Coverage Ratio shall be at least the greater of (i) 1.50
      to 1.00 and (ii) the statutory test applicable to the Transferor at any
      time'

      Section 5.05 (Covenants of the Transferor) is the only ratio covenant,
      and it is not a leverage cap, because it is the Investment Company Act
      asset coverage floor (assets over senior securities) on the parent fund.
      The other entity-level tests are floors too, in Section 7.01(o): 'a
      minimum of Unencumbered Liquidity equal to the greater of (x)
      $10,000,000' and a minimum shareholders equity of $50,000,000 for the
      Transferor, plus the Minimum Equity Condition on the Borrower. The
      Net Leverage, Senior Net Leverage, Total Net Leverage and Cash Interest
      Coverage Ratios in the definitions all measure portfolio obligors for
      eligibility and value adjustments, not the Borrower.

  - id: amgc_closing_date
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2024-07-16
    note: >
      'THIS LOAN AND SERVICING AGREEMENT is made as of July 16, 2024, among'

      The conformed agreement defines the Closing Date outright ('Closing Date
      " means July 16, 2024'). The Fourth Amendment Effective Date (October
      15, 2025) and the earlier amendment dates (March 27, 2025 and May 5, 2025
      for the First and Second) are amendment dates, not the closing.
