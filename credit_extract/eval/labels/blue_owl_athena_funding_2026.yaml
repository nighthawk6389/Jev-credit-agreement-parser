# Tier 2 assertions: Athena Funding III LLC (Blue Owl Technology Finance
# Corp.), Amendment No. 1 to Loan Financing and Servicing Agreement, dated as
# of September 11, 2026 (Exhibit 10.1).
#
# HELD OUT. Read once, to write this label, and no code was changed on its
# strength.
#
# The purest warehouse in the corpus and the one that states the case:
#
#     "collateral obligation"   777 occurrences
#     "borrowing base"           80 occurrences
#     "ebitda"                   17 occurrences
#
# Seven hundred and seventy-seven references to the assets being funded. This
# is a facility against a pool of loans, and it classifies as abl_revolver at
# 0.85 on "borrowing base" and "advance rate" -- the same two phrases that
# correctly classify Winnebago's recreational-vehicle revolver and Tailored
# Brands' retail ABL in this same batch.
#
# Two decisive families fire here, not one: recurring_revenue also hits, on
# "recurring revenue loan", which is a category of asset the pool may hold
# rather than a description of this facility. abl_revolver wins two signals to
# one, so the tie-break that would have sent an ambiguous document to the
# model never runs. The margin between "classified confidently" and "sent for
# a second opinion" is one phrase.

document: blue_owl_athena_funding_2026
corpus_name: E_blue-owl-technology-finance-corp-otf_2026-09-15_0001193125-26-391950_d74167dex101
source: real
tier: 2

assertions:

  - id: athena_funding_is_not_an_asset_based_revolver
    family: F06_structure
    member: nav_or_subscription_line
    kind: archetype
    expect: unknown
    note: >
      Expected to fail until the classifier changes, and recorded rather than
      repaired, because this is the held-out side.

      The error is not that abl_revolver is an imprecise label for a
      warehouse. It is that abl_revolver rules nav_tests inapplicable, and
      nav_tests is the group a warehouse's coverage and overcollateralisation
      tests belong to. The archetype chosen on the strength of the borrowing
      base suppresses the tests the borrowing base is measured by.

      unknown, not nav_or_subscription: the nav_or_subscription profile is for
      a fund-level line against uncalled capital or portfolio NAV, and this is
      an SPV against a pool of collateral obligations. Its decisive vocabulary
      -- "net asset value", "uncalled capital", "subscription facility",
      "portfolio investments" -- does not describe this deal either. The
      corpus has three of these facilities and no profile that fits them, so
      the honest answer is that the classifier should decline, and the
      register should carry a gap rather than a wrong box.

  - id: athena_funding_collateral_vocabulary_is_about_the_pool
    family: F06_structure
    member: abl_borrowing_base
    kind: field_status
    target: borrowing_base.advance_rate_inventory
    expect: absent_from_document
    note: >
      An advance rate against inventory is what an asset-based revolver has.
      This facility advances against collateral obligations, so the field is
      affirmatively not here -- absent_from_document, not needs_review and not
      external_reference.

      It is the same question the collateral-vocabulary veto already answers
      on the fit side for Golub's cik1901612: whose balance sheet the words
      are on. Here the answer runs the other way -- the veto stops suppression
      firing wrongly, and what this document needs is for the archetype not to
      have been chosen in the first place.

  - id: blue_owl_athena_funding_page_furniture_splits_a_sentence
    family: F11_layout
    member: table_split_across_pages
    kind: text_present
    target: "e\n\n-28-\n\nc"
    expect: true
    note: >
      31 page marks land between two lowercase letters -- inside a sentence
      rather than between paragraphs -- and each is surrounded by blank lines,
      so anything segmenting on paragraph breaks sees one sentence as two
      blocks. Athena's 219 sections are the most in the corpus, so the marks
      are diluted rather than absent. Asserted with the exact bytes, newlines
      included, because the question is whether normalisation leaves them
      there and a paraphrase could not tell. Four renderings of one defect are
      now pinned across the corpus: a bare digit, a dashed number with spaces,
      one without, and an unexpanded Word field code.

  - id: blue_owl_athena_funding_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: blue_owl_athena_funding_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_status
    target: guarantor.legal_name
    expect: absent_from_document
    note: >
      'the obligations of the Borrower arising hereunder are limited recourse
      obligations payable solely from the Collateral'

      There is no guarantor because Athena Funding III LLC is a
      special-purpose borrower whose only credit support is the Collateral it
      pledges under Section 12.1; the text has no Guarantor term, guaranty or
      guarantor party, and the Equityholder and Services Provider give no
      guarantee of the Obligations. The guarantors it does mention support
      the loan pool, not this facility: 'any guarantees or similar credit
      enhancement for an Obligor'.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: athena_facility_amount_is_stated
    family: F06_structure
    member: nav_or_subscription_line
    kind: field_value
    target: revolver.commitment
    expect: "$250,000,000"
    note: >
      '" Facility Amount " means (a) prior to the end of the Revolving Period, $ 250,000,000 , unless this amount is permanently reduced pursuant to Section 2.5 or increased pursuant to Section 2.8'
      and the Annex B Commitments schedule closes with 'Total: |  | $ | 250,000,000'.

      The conformed Loan Financing and Servicing Agreement (through Amendment
      No. 1) states the committed size, and the Annex B total (Deutsche Bank
      and First-Citizens) states the same figure, so nothing is added up here.
      Near misses rejected: the Section 2.8 accordion, which lets the Borrower
      request an increase of the Facility Amount to an amount up to
      $250,000,000 (the same number, but a ceiling, not the source), and the
      $150,000,000 in Required Equity Stage 1 Period, which is an advances
      threshold.

  - id: athena_maturity_springs_from_undated_effective_date
    family: F10_conditionality
    member: springing_on_trigger
    kind: field_value
    target: revolver.maturity_date
    expect: null
    note: >
      '" Facility Termination Date " means the earliest of (i) the date that is two (2) years after the last day of the Revolving Period'
      ; '" Revolving Period " means the period of time starting on the Effective Date and ending on the earliest to occur of (i) the date that is three (3) years after the Effective Date'
      ; 'This Agreement shall become effective on the first day (the " Effective Date ") on which the Facility Agent, on behalf of the Lenders, shall have received the following'
      ; and Section 2.4(a) requires repayment of the Advances 'in full on the Facility Termination Date'.

      The final maturity is the Facility Termination Date: two years after a
      Revolving Period that runs three years from the Effective Date, and the
      Effective Date is the day the Section 6.1 conditions are satisfied, an
      event the text never dates (no date later than 2026 appears anywhere in
      the file). The pipeline must not report 2031-05-21, nor the Revolving
      Period end 2029-05-21: both count from the May 21, 2026 as-of date of the
      agreement, and the text does not say the Effective Date fell on that day.
      The Section 2.6 option to extend the Revolving Period by twelve months is
      noted; the other limbs of the earliest-of are events.

  - id: athena_margin_steps_up_after_revolving_period
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "2.25%"
    note: >
      '" Applicable Margin " means (i) during the Revolving Period and prior to the occurrence of any Facility Termination Event, 2.10% per annum , (ii) on and after the end of the Revolving Period and prior to the occurrence of any Facility Termination Event, the Applicable Margin shall be increased by 0.15% per annum and (iii) after the occurrence of any Facility Termination Event, the Applicable Margin shall be increased by 2.00% per annum'
      ; '" Interest Rate " means, for any Accrual Period and any Lender, a rate per annum equal to the sum of (a) the Applicable Margin and (b) the Cost of Funds Rate'
      ; and the Applicable Interest Rate for a dollar Advance is 'with respect to any other Collateral Obligation or any other Advance, Term SOFR'.

      Computed: the margin is 2.10% during the Revolving Period and
      2.10% + 0.15% = 2.25% after the Revolving Period ends, so the highest
      level of the schedule is 2.25%. The further +2.00% in clause (iii)
      applies only after a Facility Termination Event (the Article XIII default
      events) and is excluded as a default step-up. One margin applies to every
      currency and to the Alternate Base Rate fallback; there is no separate
      ABR margin.

  - id: athena_term_sofr_floor_is_zero
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.00%"
    note: >
      '" Term SOFR " means, for any calculation with respect to an Advance in Dollars (other than an Advance bearing interest at the Alternate Base Rate), the greater of (i) 0.0% and (ii) the Term SOFR Reference Rate for a tenor of three (3) months'

      The dollar benchmark is floored at 0.0%, written here as 0.00%. The
      EURIBOR Rate and Term CORRA carry the same zero floor. The Alternate Base
      Rate floor (clause (c), 0) is a base-rate floor and was not the source.

  - id: athena_undrawn_fee_rate_is_stated
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.25%"
    note: >
      '" Undrawn Fee Rate " means on any day until the end of the Revolving Period, 0.25%'
      ; the Undrawn Fee is 'equal to (x) the excess of the aggregate Commitments on such day over the equivalent in Dollars of the aggregate principal amount of outstanding Advances on such day multiplied by (y) the Undrawn Fee Rate'.

      A flat 0.25% on unused commitments during the Revolving Period, stated in
      the agreement itself (Section 8.4 mentions fee letters only generally).
      Near misses rejected: the Make-Whole Fee, which charges the Applicable
      Margin on the shortfall of Advances below the Make-Whole Fee Percentage
      (25%, 50%, 60%) of the Commitments, is a minimum utilization fee; the
      Reduction Fee is a prepayment fee.
