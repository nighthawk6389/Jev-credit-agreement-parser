assertions:

  - id: athena_funding_is_not_an_asset_based_revolver
    family: F06_structure
    member: nav_or_subscription_line
    kind: archetype
    expect: unknown
    note: >
      Expected to fail until the classifier changes, and recorded rather than
      repaired, because this is the held-out side.

      The error is not that abl_revolver is an imprecise label for a
      warehouse. It is that abl_revolver rules nav_tests inapplicable, and
      nav_tests is the group a warehouse's coverage and overcollateralisation
      tests belong to. The archetype chosen on the strength of the borrowing
      base suppresses the tests the borrowing base is measured by.

      unknown, not nav_or_subscription: the nav_or_subscription profile is for
      a fund-level line against uncalled capital or portfolio NAV, and this is
      an SPV against a pool of collateral obligations. Its decisive vocabulary
      -- "net asset value", "uncalled capital", "subscription facility",
      "portfolio investments" -- does not describe this deal either. The
      corpus has three of these facilities and no profile that fits them, so
      the honest answer is that the classifier should decline, and the
      register should carry a gap rather than a wrong box.

  - id: athena_funding_collateral_vocabulary_is_about_the_pool
    family: F06_structure
    member: abl_borrowing_base
    kind: field_status
    target: borrowing_base.advance_rate_inventory
    expect: absent_from_document
    note: >
      An advance rate against inventory is what an asset-based revolver has.
      This facility advances against collateral obligations, so the field is
      affirmatively not here -- absent_from_document, not needs_review and not
      external_reference.

      It is the same question the collateral-vocabulary veto already answers
      on the fit side for Golub's cik1901612: whose balance sheet the words
      are on. Here the answer runs the other way -- the veto stops suppression
      firing wrongly, and what this document needs is for the archetype not to
      have been chosen in the first place.
