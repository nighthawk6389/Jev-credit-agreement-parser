    target: guarantor.legal_name
    expect: ["Hoya Intermediate, LLC", "VIVID SEATS LLC", "ACTCO LLC", "TICKET WEBSITE LLC", "ACTIVE TICKET COMPANY LP", "VIVID HOSPITALITY LLC", "WORLD TICKET SOURCE, LLC", "SKYBOX TICKET RESALE PLATFORM LLC", "TICKET FULFILLMENT SERVICES LP", "VIVID PICKS, LLC", "VIVID VDC, LLC", "INTERNATIONAL TICKETS LLC", "VIVID SEATS INTERNATIONAL LLC"]
    note: >
