# Tier 2 assertions: NFE FLNG 2 Parent LLC (New Fortress Energy Inc.), credit
# agreement (Exhibit 10.3), filed September 11, 2026.
#
# HELD OUT. Read once, to write this label, and no code was changed on its
# strength.
#
# A project financing for a floating LNG facility, and the document that
# resolves the circular Floor definition four other held-out agreements leave
# open:
#
#   "Floor": the benchmark rate floor (which may be zero), if any, provided
#   for in this Agreement with respect to Term SOFR or any Benchmark
#   Replacement as determined for any Class of Loans. The Floor shall be 1.00%
#   per annum with respect to the Term Loans.
#
# Two sentences. The first defines the term as whatever the agreement
# provides, which is no definition. The second provides it. So the same
# paragraph contains both the failure and its repair, and the repair is in the
# sentence after the one that ends the definition -- outside the quotation
# marks, outside the "means" clause, in text a definition extractor has
# already stopped reading.
#
# Its maturity is an anniversary of a closing date that never resolves, and
# rolls backward:
#
#   "Maturity Date": with respect to the Term Loans, the third anniversary of
#   the Closing Date; provided that if such date is not a Business Day, then
#   the Maturity Date shall be the immediately preceding Business Day.
#
#   "Closing Date": the date on which the conditions specified in Section 4.1
#   are satisfied (or waived).

document: new_fortress_flng2_2026
corpus_name: F_new-fortress-energy-inc-nfe_2026-09-11_0001749723-26-000118_a103nfe-flng2xcreditagreem
source: real
tier: 2

assertions:

  - id: new_fortress_floor_is_resolved_by_the_next_sentence
    family: F09_definitional_depth
    member: circular_definition
    kind: field_value
    target: libor_floor_pct
    expect: "1.00%"
    note: >
      1.00%, and the only place it is stated is the sentence after the
      definition ends.

      This is the sharpest test of definitional scope in the corpus. A parser
      that takes a definition to run from the opening quotation mark to the
      first full stop gets "the benchmark rate floor, if any, provided for in
      this Agreement" and returns nothing, correctly by its own rule and
      wrongly about the deal. A parser that reads to the next defined term
      gets 1.00%.

      Bain Capital in this same batch has the identical construction with the
      resolving sentence beginning "Commencing on the Closing Date"; Blue Owl
      Core Income, Winnebago and Tailored Brands have the first sentence with
      no second. So of the five documents sharing this standard form, two
      resolve in trailing prose and three do not resolve at all -- and the
      difference is invisible to anything that stops at the full stop.

  - id: new_fortress_closing_date_is_an_event
    family: F03_external_reference
    member: schedule_omitted_from_filing
    kind: field_status
    target: closing_date
    expect: absent_from_document
    note: >
      '"Closing Date": the date on which the conditions specified in Section
      4.1 are satisfied (or waived).' The eleventh undated closing date, and
      the colon convention again -- Somnigroup is not alone in it after all,
      though Somnigroup is the only one that uses it for a stated date.

  - id: new_fortress_maturity_rolls_backward
    family: F10_conditionality
    member: springing_on_trigger
    kind: field_status
    target: initial_term_loan.maturity_date
    expect: absent_from_document
    note: >
      The third anniversary of a closing date the document does not fix, so
      the maturity is not computable -- and absent_from_document rather than
      external_reference, because the chain terminates inside this filing at
      Section 4.1 rather than pointing to a document that is elsewhere.

      The business day proviso is the part worth recording for its own sake:
      "the immediately preceding Business Day", the third term in the corpus
      to roll backward after Compass Diversified's Maturity Date and nVent's.

      CORRECTED on a second pass. This note first read "three documents ...
      all rolling backward", which was an over-generalisation from a clause to
      a filing. All three carry both directions:

          Compass Diversified   succeeding 7, preceding 5
          New Fortress Energy   succeeding 6, preceding 3
          nVent Electric        succeeding 6, preceding 2

      So no document in the corpus has *a* business day convention. Each has
      several, assigned per term, and in all three the maturity is the one
      that rolls backward while the majority of the document rolls forward.
      That is the real finding and it is sharper than the one it replaces:
      the convention cannot be extracted at document level at all, and a
      reader who supplies "following" without noticing -- which is the market
      default -- is wrong about precisely the term that matters most.

  - id: new_fortress_flng2_carries_several_business_day_conventions
    family: F08_units
    member: ratio_formatting
    kind: text_present
    target: "next succeeding Business Day"
    expect: true
    note: >
      This agreement uses 4 different business day conventions: next
      succeeding business day 4; immediately preceding business day 2;
      immediately succeeding business day 2; next preceding business day 1. 6
      roll forward and 3 roll backward. So the convention is a property of a
      term, not of a document, and "the business day convention" is a question
      this filing does not answer. Its Maturity Date rolls backward while the
      majority of the document rolls forward, which is the arrangement that
      makes a document-level answer wrong rather than merely incomplete.
      Corrected from an earlier reading that took one proviso for the
      document's rule. The assertion targets the most frequent phrasing
      because that is the one a sampling reader would meet first -- and on
      several of these documents it is not the one that governs the maturity.

  - id: new_fortress_flng2_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  - id: new_fortress_flng2_administrative_agent
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: administrative_agent.legal_name
    expect: "WILMINGTON TRUST, NATIONAL ASSOCIATION"
    note: >
      "WILMINGTON TRUST, NATIONAL ASSOCIATION, as Administrative Agent" on the
      cover. The counterweight to governing law, which is New York almost
      everywhere. This field has real variety -- sixteen distinct institutions
      across the corpus -- so a pipeline cannot look competent on it by
      guessing. Three of the sixteen are not banks: Global Loan Agency
      Services Limited, Wilmington Trust and Cantor Fitzgerald Securities are
      agency businesses rather than lenders, which is the direct-lending and
      project-finance pattern and the one a reader expecting a bank name will
      misread.
