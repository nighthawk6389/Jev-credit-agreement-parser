# Tier 2 assertions: GBDC 4 Funding III / BNP Paribas, 2024.
#
# SEC EDGAR exhibit 10.1. A revolving credit and security agreement -- a BDC
# warehouse facility, lending against a pool of collateral loans at advance
# rates that vary by loan type and class.
#
# This is the archetype counterweight to the Health Catalyst filing. Its
# capacity is a borrowing base, not a commitment; it has no term loan and no
# delayed draw; and it never mentions Consolidated EBITDA either, for an
# entirely different reason. A field model built around a cash-flow term loan
# describes almost nothing in it, which is the point.
#
# Its title is also the reason the role classifier changed: "REVOLVING CREDIT
# AND SECURITY AGREEMENT" matches the standalone security-agreement pattern,
# and classifying it as an ancillary document drops the whole deal out of the
# chain.

document: cik1901612_ex10-1_2024
source: real
tier: 2
archetype: abl_revolver

assertions:
  # -- F06 structure -------------------------------------------------------
  - id: gbdc_archetype_is_borrowing_base
    family: F06_structure
    member: abl_borrowing_base
    kind: archetype
    expect: abl_revolver
    note: >
      Decisive vocabulary: "Borrowing Base" and "Advance Rate", the latter set
      out in a table by Loan Type and Loan Class (75.0%, 70.0%, 65.0%).

  - id: gbdc_has_no_term_loan
    family: F06_structure
    member: abl_borrowing_base
    kind: field_status
    target: initial_term_loan.commitment
    expect: not_applicable_to_archetype
    note: >
      "REVOLVING CREDIT AND SECURITY AGREEMENT among GBDC 4 FUNDING III LLC,
      as Borrower" -- and "term loan" occurs zero times in the whole document.

      not_applicable_to_archetype rather than absent_from_document, which is
      the distinction the status exists for: this is not an agreement that
      happens to be silent about a term loan, it is a revolving warehouse that
      cannot have one. Note added on a second pass; the assertion predates the
      guide's requirement that every one carry its quotation.

  - id: gbdc_has_no_delayed_draw
    family: F06_structure
    member: abl_borrowing_base
    kind: field_status
    target: delayed_draw.commitment
    expect: not_applicable_to_archetype
    note: >
      The harder half of the pair, and the one that produced a real defect.
      "Delayed draw" occurs nineteen times and every one of them is inside
      "Delayed Drawdown Collateral Loan" -- a category of asset the warehouse
      may buy, not a tranche it has. The suppression veto read those nineteen
      as evidence this facility had a delayed draw of its own and cancelled
      the suppression, leaving three correct answers in review.

      So the count is the trap and the answer is still not_applicable: whose
      balance sheet the words are on is the question, and here it is the
      obligors'.

  - id: gbdc_term_loan_maturity_is_not_applicable
    family: F06_structure
    member: abl_borrowing_base
    kind: field_status
    target: initial_term_loan.maturity_date
    expect: not_applicable_to_archetype
    note: >
      Follows gbdc_has_no_term_loan: a facility with no term loan has no term
      loan maturity. Kept as a separate assertion because suppression is
      per-field, and a profile that rules the commitment inapplicable while
      leaving the maturity in review would be reporting half an answer.

  # -- the parties, which is where recall on a real filing starts ----------
  - id: gbdc_borrower
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: borrower.legal_name
    expect: GBDC 4 FUNDING III LLC
    note: >
      Named on the cover, "among GBDC 4 FUNDING III LLC, as Borrower", and
      five times in the document.

      The near-miss is Golub Capital BDC 4, Inc., which appears on the same
      cover line "as Equityholder and as Servicer" and is the entity a reader
      would recognise. The borrower is the bankruptcy-remote SPV; the sponsor
      is not a party to the debt. Filing the sponsor here would attribute a
      facility to the wrong balance sheet, which is the same error the
      archetype assertions above guard field by field.

  - id: gbdc_administrative_agent
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: administrative_agent.legal_name
    expect: BNP PARIBAS
    note: >
      "BNP PARIBAS, as Administrative Agent", on the cover, one of three roles
      named in the same sentence -- Borrower, Administrative Agent,
      Equityholder and Servicer. Four occurrences in the document.

      The cover page of a warehouse names more parties in one sentence than
      most agreements name anywhere, which is why this is filed under F01
      rather than as administrative trivia: the failure it guards is picking
      the wrong one of four names that are 40 characters apart.

  # -- F01 integrity -------------------------------------------------------
  - id: gbdc_unattached_exhibits_are_a_filing_artifact
    family: F01_integrity
    member: referenced_schedule_absent
    kind: invariant_fired
    target: referenced_schedules_present
    expect: false
    note: >
      Thirty-four exhibits and schedules are referenced and one is attached.
      That is a property of the filing, not of the deal -- exhibits are filed
      as separate documents -- and F03 keeps the two apart. This assertion
      originally expected an integrity violation, contradicting its own note;
      measured across the corpus the unqualified check fired on 78 of 98 real
      agreements, which is not a market-wide defect but how EDGAR works. It
      now fires when a filer attached most of what they cite and left one out,
      or when an extracted term depends on the missing one. The unattached
      exhibits are still reported, as external references of kind
      omitted_from_filing, which is where a reader should look for them.

  - id: gbdc_reserved_sections_are_referenced
    family: F01_integrity
    member: broken_cross_reference
    kind: invariant_fired
    target: cross_references_resolve
    expect: true
    note: Sections 2.16 and 8.05 are printed as reserved and cited anyway

  # -- F07 benchmark -------------------------------------------------------
  - id: gbdc_term_sofr_with_no_csa_is_not_a_finding
    family: F07_benchmark
    member: sofr_credit_spread_adjustment
    kind: invariant_fired
    target: csa_not_silently_zero
    expect: false
    note: >
      22 references to Term SOFR and no credit spread adjustment stated, so
      zero is correct. What this document does carry is benchmark-transition
      boilerplate promising a spread adjustment if SOFR is ever replaced --
      a contingency, not a term of the deal, and reading it as one is what
      kept this check firing after the first attempt to narrow it.

  # -- coverage ------------------------------------------------------------
  - id: gbdc_uncaptured_content_is_swept
    family: F01_integrity
    member: undefined_term_used
    kind: report_count
    target: orphan_chunks
    expect: 141
    note: >
      A tripwire on the sweep, not a target. 182 tables in this document and
      the field model reaches almost none of them.

      Was 143, and it fired -- which is what a tripwire is for. The
      definitions tier now produces candidates from two chunks the sweep
      previously saw nothing in, so those two stopped being orphans. Fewer
      uncaptured chunks is the right direction, and the number moves with it
      rather than being frozen: a tripwire exists to make a change noticed and
      explained, not to forbid one.
