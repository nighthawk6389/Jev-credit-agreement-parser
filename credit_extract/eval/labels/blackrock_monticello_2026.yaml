# Tier 2 assertions: BlackRock Monticello Debt Real Estate Investment Trust,
# credit facility (Exhibit 10.6), August 2026.
#
# Fit side, never read during development. The corpus's second self-referential
# definition, and a cleaner one than the first:
#
#   "Maturity Date" means the earliest to occur of (i) the Stated Maturity
#   Date, (ii) the date of the declaration, or automatic occurrence, of THE
#   MATURITY DATE pursuant to Section 7.2 and (iii) the Collection Date.
#
# Limb (ii) defines the Maturity Date as, among other things, the date the
# Maturity Date occurs. Cumberland Farms' circularity is a computation that
# converges -- each branch assumes its own percentage to test whether it
# applies -- and this one is a naming convention: Section 7.2 accelerates the
# facility and the drafter calls the accelerated date "the Maturity Date", so
# the definition folds that back into itself.
#
# Both are correct drafting and both defeat a closure walk. A definition graph
# that refuses cycles loses the maturity here and the excess cash flow
# percentage there, on two agreements that have nothing else in common.

document: blackrock_monticello_2026
corpus_name: L_blackrock-monticello-debt-real-estate-investment-trust_2026-08-07_0001193125-26-339198_ck0002049595-ex10-6
source: real
tier: 2

assertions:

  - id: blackrock_maturity_resolves_past_its_self_reference
    family: F09_definitional_depth
    member: circular_definition
    kind: field_value
    target: revolver.maturity_date
    expect: 2030-07-30
    note: >
      '" Stated Maturity Date " means July 30, 2030.' and '" Maturity Date "
      means the earliest to occur of (i) the Stated Maturity Date, (ii) the
      date of the declaration, or automatic occurrence, of the Maturity Date
      pursuant to Section 7.2 and (iii) the Collection Date.'

      Corrected. This assertion used to expect no answer, on the ground that
      the exhibit does not define the Stated Maturity Date in the text
      available. It does, in the definitions article, and two independent
      labellers found it. Limb (ii) names the term it defines and limb (iii)
      is an event, so the one limb with a date settles it: the circularity is
      real and harmless. A reader that refuses any definition naming itself
      loses this maturity; one that follows limb (i) gets it.

  - id: blackrock_closing_date_is_stated
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2025-07-30
    note: >
      '"Closing Date" means July 30, 2025.' Stated, and here as the control
      against the maturity above: the same document answers one date field
      outright and cannot answer the other at all.

  - id: blackrock_monticello_floor_is_stated
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.00%"
    note: >
      "Floor" means 0.00%. Stated outright and unconditional -- the shape that
      resolves, against the five documents whose Floor is defined as "the
      benchmark rate floor, if any, provided in this Agreement" and only two
      of those resolve in a trailing sentence. Written without the spaces the
      normaliser usually leaves around the quotation marks, which is a
      reminder that the anchor patterns cannot rely on them.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: blackrock_monticello_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: guarantor.legal_name
    expect:
      - "BLACKROCK MONTICELLO DEBT REAL ESTATE INVESTMENT TRUST"
    note: >
      'BLACKROCK MONTICELLO DEBT REAL ESTATE INVESTMENT TRUST, a Maryland
      statutory trust, as the guarantor' -- and in Article XII, 'Guarantor does
      hereby irrevocably and unconditionally guarantee the due and punctual
      payment when due, and performance of the Guarantied Obligations', which
      reach 'solely following the occurrence of a Full Recourse Event, all
      Obligations of Borrower'.

      The trust is the one party the agreement names as Guarantor, in the
      preamble and in both signature blocks, and the text says its guaranty
      covers the Obligations. BLK MAM Holding, LLC and BLKM Funding (TRS), LLC
      are left out: each gives a 'Limited Recourse Guaranty and Pledge
      Agreement, dated as of July 22, 2026, by and between BLKM Funding (TRS),
      LLC' (or BLK Holding) and the Administrative Agent, which the definitions
      file under Pledge Agreement, and nothing says either guarantees the
      Obligations.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: blackrock_maximum_facility_amount_is_stated
    family: F06_structure
    member: nav_or_subscription_line
    kind: field_value
    target: revolver.commitment
    expect: "$410,000,000"
    note: >
      '" Maximum Facility Amount " means the aggregate Commitments as then in
      effect, which amount shall not exceed $ 410,000,000 (as such amount may be
      increased from time to time with the consent of the Administrative Agent,
      the Required Lenders and the Borrower in accordance with Section 2.13 )'
      and the conformed cover 'CHANGES CONFORMED THROUGH AMENDMENT NO. 5 U.S. $
      410,000,000 CREDIT AGREEMENT'.

      The $410,000,000 is the facility amount as amended by Amendment No. 5
      (whose conditions refer to 'the increase to the Maximum Facility Amount as
      of the date hereof'), stated on the cover and in the definition as the
      amount before any Section 2.13 increase, so it is the commitment and not a
      ceiling. Rejected the accordion, which is separate: 'to increase the
      Maximum Facility Amount by up to an additional amount of $ 240,000,000'
      (never added in). Annex A with the per-lender Commitments is not in the
      text; after the Funding Period the Maximum Facility Amount becomes the
      Advances Outstanding.

  - id: blackrock_spread_steps_up_after_funding_period
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "2.50%"
    note: >
      '" Applicable Spread " means (i) from the Closing Date through and
      including the last day of the Funding Period, 2.00%, and (ii) from day
      following the last day of the Funding Period to the Maturity Date, 2.50%.'

      The Interest Rate is 'an interest rate per annum equal to the Benchmark
      for such date plus the Applicable Spread' and '" Benchmark " means,
      initially, Term SOFR'. Two levels exist: 2.00% during the Funding Period
      (to July 30, 2028) and 2.50% after it ends. A step-up after the revolving
      period is part of the schedule, so the highest level, 2.50%, is the
      answer. There is no base rate margin. Rejected the Default Rate ('the per
      annum rate which is two percent (2.0%) greater than the Interest Rate
      applicable to such Advance'), which applies only after an Event of
      Default.

  - id: blackrock_non_usage_fee_steps_with_utilization
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.25%"
    note: >
      'The Non-Usage Fee Rate (the " Non-Usage Fee Rate ") shall be equal to:
      (a) if the average daily Advances Outstanding during such Remittance
      Period are less than or equal to 70% of the Maximum Facility Amount, 0.25%
      , and (b) if the average daily Advances Outstanding during such Remittance
      Period are greater than 70% of the Maximum Facility Amount, 0.00% .'

      The Non-Usage Fee accrues on the Maximum Facility Amount minus the
      Advances Outstanding. It is 0.25% at or below 70% utilization and 0.00%
      above it, so the highest rate is 0.25%. Rejected the separately defined
      Commitment Fee, 'an aggregate amount equal to the product of the Maximum
      Facility Amount and 0.25%'. That is a one-time fee on the whole facility,
      paid at closing and on each Advance, so it is an upfront fee and not a fee
      on undrawn commitments. It happens to use the same rate.
