  - id: blackrock_maturity_definition_names_itself
    family: F09_definitional_depth
    member: circular_definition
    kind: field_value
    target: revolver.maturity_date
    expect: null
    note: >
      No answer, and the reason is worth separating from the corpus's other
      empty maturities.

      Aspen's is empty because its chain ends at an undated event. Eagle
      Point's is empty because four hops end at two events. This one is empty
      because the only limb that could carry a date is limb (i), the Stated
      Maturity Date, which this exhibit does not define in the text available;
      limb (ii) points at itself and limb (iii) is the Collection Date, an
      event.

      So a reader must establish that a three-limb "earliest to occur of"
      resolves to nothing, while two nearly identical constructions elsewhere
      in the corpus -- Fidelity's and Blue Owl Technology's -- resolve to a
      date because one limb carries one. The phrase is not the signal.

  - id: blackrock_closing_date_is_stated
    family: F05_versioning
