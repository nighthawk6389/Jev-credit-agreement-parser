# Tier 2 assertions: Crownpeak Intermediate Holdings, Inc. and Subsidiaries,
# consolidated financial statements for the years ended January 31, 2026 and
# 2025, filed by Rezolve AI plc as Exhibit 99.3 on September 1, 2026.
#
# HELD OUT. Read once, to write this label, and no code was changed on its
# strength.
#
# The sibling of rezolve_financials_2026, which is Exhibit 99.4 of the same
# submission and sits on the fit side. The split assigned the two halves of
# one filing to opposite sides, which is worth saying plainly: the hash rule
# does not know that two exhibits came in together, and neither exhibit is
# harmed by it, because neither is a credit agreement.
#
# What distinguishes this one is whose financial statements they are. Exhibit
# 99.4 is Rezolve's; this is Crownpeak's -- a company Rezolve is acquiring.
# The filer name on the document is Rezolve and the entity the numbers belong
# to is Crownpeak, and nothing in the exhibit's own text says Rezolve at all.
#
# That makes it the second target-financials case after Sysco's JRD Unico, and
# the two of them together are the reason the harvest's filer name is not a
# safe key for anything. Three companies appear in these two filings -- the
# acquirer, the target, and in Rezolve's case the acquirer again under its own
# exhibit -- and a pipeline that groups by filer folds all of them into one.

