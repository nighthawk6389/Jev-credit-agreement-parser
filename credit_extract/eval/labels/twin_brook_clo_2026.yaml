assertions:

  - id: twin_brook_closing_date_is_the_original_indentures
    family: F05_versioning
    member: superseded_by_amendment_and_restatement
    kind: field_value
    target: closing_date
    expect: 2024-05-30
    note: >
      '"Closing Date": May 30, 2024.' on a supplemental indenture dated August
      19, 2026 -- so the date belongs to the original indenture, which is not
      in the harvest.

      Fourth document in the corpus whose Closing Date predates its own
      instrument by more than a year, after Virco (2012 on 2026), BrightSpring
      (2019 on 2026) and Horizon (2024 on 2026). The pattern is now common
      enough to state plainly: on an amendment, this field is almost never the
      document's own date, and the gap carries no information about whether
      the value was read correctly.

  - id: twin_brook_ebitda_belongs_to_the_obligors
    family: F06_structure
    member: nav_or_subscription_line
    kind: field_status
    target: consolidated_ebitda.addback_cap_pct
    expect: absent_from_document
    note: >
      An issuer with no operations. Seventh document where EBITDA belongs to
      the obligors of assets the vehicle holds rather than to the borrower,
      and the third with more than six hundred mentions of "Collateral
      Obligation".

      The collateral-noun rule that keeps these safe was derived from a single
      document with a few dozen such mentions and a sixty-character window.
      Seven instances across CLOs, warehouses, a BDC and a servicing agreement
      is the evidence that the window was not fitted to one filing's habits.
