# Tier 2 assertions: Bain Capital Private Credit, credit agreement (Exhibit
# 10.1), filed August 14, 2026.
#
# HELD OUT. Read once, to write this label, and no code was changed on its
# strength.
#
# A fund-level facility against a pool of Collateral Loans, 703,940 characters
# and 164 sections, and the one document in the corpus where the classifier's
# ambiguity branch does the right thing:
#
#     second_lien    fires on "second priority"
#     abl_revolver   fires on "advance rate"
#     -> two archetypes at one signal each -> unknown, sent to the model
#
# It says "second lien" nine times and "second priority" once. On any other
# tie-break -- first match wins, highest count wins, longest phrase wins -- it
# would have been classified confidently. It is unknown because two families
# tied at one, which is luck rather than judgement, and worth recording as
# such: the corpus contains exactly one document that benefits from the
# ambiguity rule, and it benefits by accident.
#
# Its Floor is the circular standard form with a resolving second sentence,
# the same construction as New Fortress Energy:
#
#   "Floor" means the benchmark rate floor, if any, provided in this Agreement
#   initially (as of the execution of this Agreement, the modification,
#   amendment or renewal of this Agreement or otherwise) - 34 - with respect
#   to Term SOFR or any Benchmark Replacement. Commencing on the Closing Date,
#   the F[loor] ...
#
# with a page number -- "- 34 -" -- flattened into the middle of the sentence,
# between "or otherwise)" and "with respect to Term SOFR".

document: bain_capital_private_credit_2026
corpus_name: H_bain-capital-private-credit_2026-08-14_0001193125-26-349812_ck0001899017-ex10-1
source: real
tier: 2

assertions:

  - id: bain_capital_ties_and_declines
    family: F06_structure
    member: second_lien
    kind: archetype
    expect: unknown
    note: >
      Right answer, fragile reason. "Second priority" is decisive of
      second_lien and fires here inside a fund facility's lien-priority
      language; a second family fires at the same strength; the tie sends the
      document to the model, which has no key and so returns unknown.

      The assertion is worth keeping precisely because the mechanism is
      incidental. If either family's vocabulary list changes by one phrase,
      this document classifies confidently, and the change that does it will
      look unrelated to this document.

  - id: bain_capital_page_number_sits_inside_a_definition
    family: F11_layout
    member: table_split_across_pages
    kind: text_present
    target: "or otherwise)\n\n- 34 -\n\nwith respect to"
    expect: true
    note: >
      A page number on its own line in the middle of a sentence, in the
      middle of a defined term's definition, surviving normalisation intact
      -- and with paragraph breaks around it, so it splits the definition
      into two blocks for anything that segments on blank lines.

      Every layout assertion so far has been about tables -- a grid rendered
      as text, a footnote modifying a table, a page number landing in KBR's
      pricing grid. This is the same defect in running prose, where there are
      no cell boundaries to make it visible. The string is asserted present
      rather than absent deliberately: it is what the operative text holds
      today, and any cleanup that removes it should have to change this
      assertion on purpose.

      AGL Private Credit in this same batch carries the worse version -- a
      Word field code, a document ID and a page number spliced between "after
      the" and "occurrence of an Event of Default".

  - id: bain_capital_closing_date_is_stated
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2026-05-08
    note: >
      '"Closing Date" means May 8, 2026.' Stated, three months before the
      filing, and the control for the Floor assertion above: the same document
      that leaves a rate open states a date outright, so a failure on the
      Floor cannot be blamed on the document being uniformly evasive.

  - id: bain_page_numbers_are_dashed_and_frequent
    family: F11_layout
    member: table_split_across_pages
    kind: report_count
    target: orphan_chunks
    compare: at_most
    expect: 0
    note: >
      Bain renders its page numbers as "- 7 -", "- 10 -", "- 34 -" and so on,
      66 of which land mid-sentence. The assertion is on the orphan sweep
      rather than on the text because the question worth asking is downstream:
      does furniture at that density manufacture orphans? A count of the
      pipeline's own working is a tripwire and not a proposition about the
      deal -- the harness marks it non-confident for exactly that reason -- so
      a change here is something to investigate rather than a silent error. It
      is filed under F11 because the thing that would move it is a
      segmentation change, and segmentation is what page furniture breaks.

  - id: bain_capital_private_credit_carries_several_business_day_conventions
    family: F08_units
    member: ratio_formatting
    kind: text_present
    target: "next succeeding Business Day"
    expect: true
    note: >
      This agreement uses 1 different business day conventions: next
      succeeding business day 8. 8 roll forward and 0 roll backward. So the
      convention is a property of a term, not of a document, and "the business
      day convention" is a question this filing does not answer. Bain is the
      control and the only document in the corpus with a single convention,
      which is what makes the others' plurality a finding rather than an
      artefact of counting. Corrected from an earlier reading that took one
      proviso for the document's rule. The assertion targets the most frequent
      phrasing because that is the one a sampling reader would meet first --
      and on several of these documents it is not the one that governs the
      maturity.

  - id: bain_capital_private_credit_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: bain_capital_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_status
    target: guarantor.legal_name
    expect: absent_from_document
    note: >
      'Each Lender, each Equity Investor and the Agents acknowledges that the
      Borrower is a special purpose entity' and 'there shall be no recourse for
      the payment of any amount owing by the Borrower hereunder against any
      other party hereto'

      There is no guarantor because SLP 2 MM CLO WH 2, LLC is a special-purpose
      CLO warehouse borrower whose only credit support is the Grant of its
      Collateral Loans, accounts and related assets; the Loan Documents are
      'this Agreement, the LLC Agreement, the Account Control Agreement, the
      Purchase and Sale Agreement, the Participation Agreements, the Collateral
      Management Agreement, the Loan Notes, the Interest Hedge Agreements, the
      EU/UK Retention Letter and any Posting Agent Letter Agreement', with no
      guaranty. Every guarantor the text mentions is a guarantor of a
      Collateral Loan ('any Person who is obligated to repay such Collateral
      Loan (including, if applicable, a guarantor thereof)'), not of these
      Loans.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: bain_stated_maturity_is_may_2034
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: revolver.maturity_date
    expect: 2034-05-08
    note: >
      'Section 2.4 Maturity . Each Loan shall mature, and the principal amount
      thereof shall be due and payable, on the Stated Maturity' and
      '" Stated Maturity " means May 8, 2034'

      Followed Section 2.4 to the Stated Maturity definition, a bare date with
      no business-day roll, which governs both the Revolving Loans and the Term
      Loans. Rejected the earlier end of availability: the Revolving Loan
      Commitment Period ends on the last day of the Reinvestment Period, which
      ends on the earliest of events including '(a) the 18-month anniversary of
      the Closing Date'. No extension option exists; extending the Stated
      Maturity needs an amendment signed by all Lenders (Section 12.6).

  - id: bain_margin_steps_up_at_18_month_anniversary
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "1.85%"
    note: >
      '" Applicable Margin " means (i) from and including the Closing Date to
      but excluding the 18-month anniversary of the Closing Date, 1.70 % per
      annum and (ii) from and including the day that is the 18-month
      anniversary of the Closing Date and thereafter, 1.85 % per annum'

      Interest is the Applicable Rate, '" Applicable Rate " means, the sum of
      (x) the Benchmark applicable to the relevant Interest Period plus (y) the
      Applicable Margin', and '" Benchmark " means Term SOFR'. Two levels exist,
      1.70% and then 1.85% from the 18-month anniversary, the same date the
      Reinvestment Period ends under its clause (a); a step-up after the
      reinvestment period is part of the schedule, so the top level is 1.85%.
      There is no separate ABR margin (the ABR fallback adds the same
      Applicable Margin), and the Post-Default Rate extra two percent is
      excluded.

  - id: bain_term_sofr_floor_is_zero
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.00%"
    note: >
      'If Term SOFR as so determined would be less than the Floor, such rate
      shall be deemed to be equal to the Floor' and 'with respect to Term SOFR
      or any Benchmark Replacement. Commencing on the Closing Date, the Floor
      shall be zero'

      The Term SOFR definition floors the benchmark at the defined Floor, and
      the Floor definition sets it at zero (the text writes the word zero),
      i.e. 0.00%. Not the floor of zero inside the Alternate Base Rate
      definition, and not the Floor Obligation definition, which describes
      collateral loans held by the Borrower.

  - id: bain_commitment_fee_steps_with_unused_amount
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "1.00%"
    note: >
      '(ii) from and including the six-month anniversary of the Closing Date,
      (x) 0.50% of the Undrawn Commitment in respect of the Loans as of the end
      of such day so long as the daily average unused amount is less than 25%
      of the Total Revolving Loan Commitment or the Total Term Loan Commitment
      (as applicable), and (y) otherwise, 1.00% of the Undrawn Commitment in
      respect of the Loans as of the end of such day'

      Section 2.6(a) Commitment Fee: 0.50% of the Undrawn Commitment for the
      first six months, then 0.50% while the daily average unused amount is
      below 25% of the commitment and 1.00% otherwise, so the highest rate is
      1.00%. It is charged on the whole Undrawn Commitment, so it is a
      commitment fee that steps with utilization, not a minimum utilization
      fee on a shortfall; no other unused fee appears in the agreement.
