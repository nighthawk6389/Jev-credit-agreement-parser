# Tier 2 assertions for the canonical fixture.
#
# One proposition each, bound to one family member. These are cheap to write
# and each tests exactly one mechanism, so a failure names the mechanism rather
# than the document.

document: fixture_meridian_2017
source: synthetic
tier: 2
archetype: cash_flow_term_loan

assertions:
  # -- F01 integrity: defects that parse cleanly --------------------------
  - id: duplicated_rows_break_date_ordering
    family: F01_integrity
    member: duplicated_table_rows
    kind: invariant_fired
    target: amortization_dates_strictly_increasing
    expect: true
    note: the four duplicated 2023 quarters make the table step backwards

  - id: duplicated_rows_break_row_count
    family: F01_integrity
    member: duplicated_table_rows
    kind: invariant_fired
    target: amortization_row_count_matches_quarters
    expect: true
    note: >
      Trap 1's mechanism, asserted separately from the trap. The fixture's
      amortization table repeats two quarterly rows, so the row count no
      longer matches the number of quarters between the closing date and the
      maturity -- arithmetic in Python over a parsed table, which is the one
      place this project will not ask a model.

      Note added on a second pass; the assertion predates the guide's
      requirement that every one carry its reasoning.

  - id: duplicated_rows_overstate_the_total
    family: F01_integrity
    member: duplicated_table_rows
    kind: invariant_fired
    target: amortization_total_consistent
    expect: true
    note: $11,663,750 printed against $10,158,750 correct

  - id: trap_1_end_to_end
    family: F01_integrity
    member: duplicated_table_rows
    kind: trap_caught
    target: trap_1
    expect: true
    note: >
      The same defect end to end: duplicated amortization rows have to be
      caught, not merely detectable. Paired with the invariant assertion above
      because an invariant that fires while the trap reports nothing is a
      wiring failure, and one report cannot distinguish the two.

  # -- F02 precedence -----------------------------------------------------
  - id: hardcoded_ebitda_table_overrides_the_definition
    family: F02_precedence
    member: table_overrides_definition
    kind: trap_caught
    target: trap_2
    expect: true
    note: >
      Trap 2: an opening-EBITDA figure hardcoded in a table where the
      definition governs. The fixture states a Consolidated EBITDA in a
      compliance table that the definition would compute differently, and the
      table is the thing a reader sees first.

      This is the synthetic ancestor of what the real corpus later supplied in
      quantity -- Aveanna's ratings override beneath a complete grid,
      Cumberland Farms' proviso pinning its grid to Level 1. The fixture had
      to assert it before any real document did.

  # -- F03 external reference ---------------------------------------------
  - id: addback_cap_is_external
    family: F03_external_reference
    member: sponsor_model
    kind: field_status
    target: consolidated_ebitda.addback_cap_clause_a_xvi
    expect: external_reference
    note: the visible 25% cap governs (a)(xiii)-(a)(xv), not (a)(xvi)

  - id: addback_cap_carries_no_number
    family: F03_external_reference
    member: sponsor_model
    kind: field_value
    target: consolidated_ebitda.addback_cap_clause_a_xvi
    expect: null
    note: >
      Clause (a)(xvi) of Consolidated EBITDA adds back '"run-rate" cost
      savings, operating expense reductions and synergies set forth in the
      Sponsor Model, in an amount not to exceed, with respect to each such
      item, the amount set forth' there -- and the definition of Sponsor Model
      closes with "For the avoidance of doubt, the Sponsor Model is not a Loan
      Document and is not attached hereto."

      So the cap is real, material, capped by reference, and nowhere in the
      document. null is the value; the status assertion beside it carries the
      external_reference. The blind-spot register notes that real sponsor-model
      carve-outs are drafted many ways and this fixture's was written to be
      found, which is the limit of what it proves.

  # -- F04 absence --------------------------------------------------------
  - id: mfn_has_no_sunset
    family: F04_absence
    member: no_mfn_sunset
    kind: field_status
    target: mfn_sunset
    expect: absent_from_document
    note: >
      "Sunset" occurs zero times in the fixture, and the MFN protection it
      does carry has no expiry clause attached -- the protection runs for the
      life of the facility.

      absent_from_document and not needs_review, because the absence is
      affirmative: a deal with MFN and no sunset is a real and common
      arrangement, which is the whole point of F04's no_mfn_sunset member. The
      failure it guards is reporting nothing found and letting a reader infer
      the protection expires.

  - id: mfn_protection_itself_is_present
    family: F04_absence
    member: no_mfn_sunset
    kind: field_value
    target: mfn_threshold_pct
    expect: 0.50
    note: absence is only a finding because the protection exists

  # -- orphan sweep: a provision no field targets --------------------------
  - id: call_protection_surfaces_as_an_orphan
    family: F01_integrity
    member: undefined_term_used
    kind: orphan_found
    expect: Call Protection
    note: >
      Section 2.16 is deliberately outside the field registry, so only the
      inverted question can surface it.

  # -- baseline economics --------------------------------------------------
  - id: term_loan_commitment
    family: F01_integrity
    member: dropped_table_rows
    kind: field_value
    target: initial_term_loan.commitment
    expect: 150500000
    note: >
      "The aggregate amount of the Initial Term Loan Commitments on the
      Closing Date is $150,500,000."

      Filed under dropped_table_rows rather than as a plain value: the figure
      is stated in prose and also summed by the amortization table, so it is
      the control on trap 1. A dropped row changes the table's total and not
      the sentence, and the two disagreeing is the signal.

  - id: term_loan_maturity
    family: F01_integrity
    member: dropped_table_rows
    kind: field_value
    target: initial_term_loan.maturity_date
    expect: "2024-08-01"
    note: >
      '"Initial Term Loan Maturity Date" means August 1, 2024.'

      Stated outright, and the second control on trap 1: the row count
      invariant needs both ends of the schedule to be trustworthy before a
      mismatch means anything. Closing Date is August 1, 2017, so the fixture
      spans exactly seven years and the quarter count is checkable by hand --
      which is why a synthetic fixture is still worth having after 105 real
      documents.

  # Labelled from the text, without the pipeline's answer, to measure how
  # often the reader hands validator A a wrong value (the seventh pass).

  - id: meridian_amort_quarterly
    family: F06_structure
    member: delayed_draw_multi_tranche
    kind: field_value
    target: amortization.quarterly_amount
    expect: "$376,250"
    note: >
      'The Borrower shall repay the outstanding principal amount of the Initial Term Loans in consecutive quarterly installments' and 'December 31, 2017 | $376,250'

      Every installment in the Section 2.10(a) table is $376,250 (0.25% of the $150,500,000 initial term loans). Rejected the balloon due on the Initial Term Loan Maturity Date and the duplicated 2023 dates in the table, which do not change the quarterly amount.

  - id: meridian_margin_top
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "5.00%"
    note: >
      'I | Greater than 5.50:1.00 | 5.00% | 4.00%'

      Level I (leverage above 5.50:1.00) carries the highest Eurodollar Rate margin, 5.00%, which applies to Revolving Credit Loans as well as Initial Term Loans. Rejected the 4.00% Base Rate margin on the same row.

  - id: meridian_commitment_fee
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.50%"
    note: >
      'a commitment fee equal to 0.50% per annum on the average daily unused amount of the Revolving Credit Commitment of such Lender'

      The unused revolving commitment fee is a flat 0.50% per annum with no step-down. Rejected the 1.00% ticking fee, which is charged on undrawn Delayed Draw Term Loan Commitments.

  - id: meridian_ddtl_commitment
    family: F06_structure
    member: delayed_draw_multi_tranche
    kind: field_value
    target: delayed_draw.commitment
    expect: "$25,000,000"
    note: >
      'The aggregate Delayed Draw Term Loan Commitments on the Closing Date are $25,000,000.'

      The definition and the Section 2.01 table both give $25,000,000 for the Delayed Draw Term Loan Facility. Rejected the $150,500,000 Initial Term Loan Facility.

  - id: meridian_ecf_sweep
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: excess_cash_flow.sweep_pct
    expect: "50%"
    note: >
      'The Borrower shall prepay the Initial Term Loans with 50% of Excess Cash Flow for each fiscal year, with step-downs to 25% and 0%'

      The highest sweep is the 50% starting level. Rejected the leverage-based step-downs to 25% and 0%.

  - id: meridian_fronting_fee
    family: F08_units
    member: bps_vs_percent
    kind: field_value
    target: fronting_fee_pct
    expect: "0.125%"
    note: >
      'The Borrower shall pay to the Issuing Bank a fronting fee equal to 0.125% per annum of the daily maximum amount available to be drawn under each Letter of Credit.'

      The fronting fee is stated per annum (0.125% on the daily maximum available amount), not as a one-time charge on face amount. Rejected the 0.50% commitment fee and the $5,000,000 Letter of Credit Sublimit nearby.

  - id: meridian_lc_sublimit
    family: F06_structure
    member: delayed_draw_multi_tranche
    kind: field_value
    target: lc_sublimit
    expect: "$5,000,000"
    note: >
      'The aggregate face amount of all Letters of Credit outstanding at any time shall not exceed $5,000,000 (the "Letter of Credit Sublimit").'

      Section 2.05 caps outstanding Letters of Credit at $5,000,000. Rejected the $20,000,000 Revolving Credit Facility within which the sublimit sits.

  - id: meridian_benchmark_floor
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "1.00%"
    note: >
      'provided that the LIBO Rate shall not at any time be less than 1.00% per annum.'

      The floor sits on the LIBO Rate benchmark itself at 1.00% per annum; no Base Rate floor is stated. Rejected the generic mention of a LIBO Rate floor in the All-In Yield definition, which states no rate.

  - id: meridian_revolver_commitment
    family: F06_structure
    member: delayed_draw_multi_tranche
    kind: field_value
    target: revolver.commitment
    expect: "$20,000,000"
    note: >
      'The aggregate Revolving Credit Commitments on the Closing Date are $20,000,000.'

      The definition and the Section 2.01 table both give a $20,000,000 Revolving Credit Facility. Rejected the Section 2.14 incremental capacity (greater of $30,000,000 and 100% of Consolidated EBITDA), which is accordion.

  - id: meridian_ticking_fee
    family: F08_units
    member: bps_vs_percent
    kind: field_value
    target: ticking_fee_pct
    expect: "1.00%"
    note: >
      'The Borrower agrees to pay a ticking fee on the undrawn Delayed Draw Term Loan Commitments equal to 1.00% per annum'

      The ticking fee is a flat 1.00% per annum, accruing from 60 days after the Closing Date. Rejected the 0.50% revolving commitment fee.
