# Tier 2 assertions: BlackRock Monticello Debt Real Estate Investment Trust,
# credit facility (Exhibit 10.1), Closing Date June 1, 2026.
#
# Fit side, never read during development. The same sponsor as the Exhibit
# 10.6 facility labelled separately, and not the same deal -- that one closed
# July 30, 2025, this one June 1, 2026. Two facilities, ten months apart,
# carrying the same self-referential maturity:
#
#   "Maturity Date" means the earliest to occur of (i) the Stated Maturity
#   Date, (ii) the date of the declaration, or automatic occurrence, of THE
#   MATURITY DATE pursuant to Section 7.2 and (iii) the Collection Date.
#
# word for word in both. So the circularity is a house convention rather than
# a slip, which is the thing a single document could not establish. It is the
# second such pair in the corpus after "if no floor is specified, zero", which
# Limbach and Virco share across unrelated banks.
#
# It is also the third redacted filing, and the third distinct notice: this
# one cites Item 601(b)(10) of Regulation S-K where Lifetime Brands marks
# exclusions with [***] and Cadeler declares "certain identified information".

document: blackrock_monticello_june_2026
corpus_name: L_blackrock-monticello-debt-real-estate-investment-trust_2026-06-05_0001193125-26-259869_d82690dex101
source: real
tier: 2

assertions:

  - id: blackrock_june_maturity_resolves_past_its_self_reference_too
    family: F09_definitional_depth
    member: circular_definition
    kind: field_value
    target: revolver.maturity_date
    expect: 2029-06-01
    note: >
      '" Stated Maturity Date " means June 1, 2029, as the same may be
      extended in accordance with the terms of Section 2.14 hereof.' The
      Maturity Date is the earliest of the Stated Maturity Date, a
      declaration of the Maturity Date itself, and the Collection Date.

      Corrected, for the same reason as the August facility: the Stated
      Maturity Date is defined in the text after all. The two extension
      options in Section 2.14 are conditional, so the date stands as written.
      What the pair still shows is a sponsor convention: two facilities ten
      months apart define the Maturity Date in terms of itself, and a
      definition graph that refuses cycles would lose both.

  - id: blackrock_june_closing_date_is_stated
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2026-06-01
    note: >
      '"Closing Date" means June 1, 2026.' Stated, and different from the
      other facility's July 30, 2025 -- which is how the two are known to be
      separate deals rather than versions of one.

      The pair is worth keeping for that reason alone. Two exhibits from one
      sponsor with near-identical defined-term sections are exactly what a
      document-set heuristic would try to chain, and the Closing Date is the
      field that says they cannot be chained.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: blackrock_june_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: guarantor.legal_name
    expect: ["BLACKROCK MONTICELLO DEBT REAL ESTATE INVESTMENT TRUST"]
    note: >
      'BLACKROCK MONTICELLO DEBT REAL ESTATE INVESTMENT TRUST, a Maryland
      statutory trust, as the guarantor (together with its successors and
      assigns in such capacity, the " Guarantor ")'

      'Guarantor hereby unconditionally and irrevocably guarantees to
      Administrative Agent for the benefit of the Lenders the prompt and
      complete payment and performance by Borrower when due (whether at the
      stated maturity, by acceleration or otherwise) of any and all
      Obligations'

      The preamble names the REIT as the Guarantor, it signs under
      "GUARANTOR:", and Article XII is its guaranty of the Obligations of the Borrower
      (BLKM VI, LLC). The guaranty is capped at 25% of outstanding principal
      (the "Liability Cap") until a Full Recourse Event, but it is a guarantee
      of the Obligations, so the REIT is a Guarantor. No other guarantor is
      named.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: blackrock_june_maximum_facility_amount_is_stated
    family: F06_structure
    member: nav_or_subscription_line
    kind: field_value
    target: revolver.commitment
    expect: "$100,000,000"
    note: >
      '" Maximum Facility Amount " means the aggregate Commitments as then in
      effect, which amount shall not exceed $100,000,000 (as such amount may be
      increased from time to time with the consent of the Administrative Agent,
      each Lender and the Borrower in accordance with Section 2.13 )'

      The $100,000,000 is the facility amount before any increase. Rejected the
      accordion ceiling in Section 2.13, 'to increase the Maximum Facility
      Amount up to a total amount of $150,000,000'. The line revolves (a repaid
      amount 'may, subject to the terms and conditions hereof, be
      reborrowed'). Annex A with the per-lender Commitments is not in the text.
      Section 2.1 leaves each Advance to the sole discretion of the Lender, but
      the agreement still sizes the Commitments and charges a Non-Usage Fee on
      the undrawn Maximum Facility Amount.

  - id: blackrock_june_spread_steps_down_at_stabilization
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "3.00%"
    note: >
      '" Applicable Spread " means, with respect to each Advance, (i) from the
      applicable Advance Date through and including the day on which (x) a
      temporary certificate of occupancy is issued in respect of the related
      Mortgaged Property, and (y) not less than twenty percent (20%) of the
      rentable units at the related Mortgaged Property are subject to active
      lease agreements (such date, the " Stabilization Date "), 3.00%, and (ii)
      from the day following the Stabilization Date to the Maturity Date, 2.50%.'

      The Interest Rate is 'the Benchmark for such date plus the Applicable
      Spread', and the Benchmark is initially Term SOFR. Each Advance carries
      3.00% until its property reaches the Stabilization Date and 2.50% after
      that, so the highest level is 3.00%. It is a different term from the
      3.00% floor in the Term SOFR definition, though the two figures match. There
      is no base rate margin. Rejected the Default Rate ('five percent (5.0%)
      greater than the Interest Rate'), which applies only after an Event of
      Default.

  - id: blackrock_june_term_sofr_floor_three_percent
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "3.00%"
    note: >
      '" Term SOFR " means for any calculation with respect to a SOFR Advance,
      the greater of (x) three percent (3.00%) per annum, or (y) the Term SOFR
      Reference Rate for a tenor of one month'

      The floor sits inside the Term SOFR definition, written in words and in
      figures; there is no separate Floor definition. Term SOFR is the initial
      Benchmark, so the benchmark floor is 3.00%. It is a floor on the benchmark
      only, not on the all-in rate. It is distinct from the 3.00% top level of
      the Applicable Spread.

  - id: blackrock_june_non_usage_fee_below_65_percent_utilization
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.25%"
    note: >
      'The Non-Usage Fee Rate (the " Non-Usage Fee Rate ") shall be equal to: if
      the Advances Outstanding on such day are less than or equal to 65% of the
      Maximum Facility Amount, 0.25%.'

      The Non-Usage Fee accrues daily on the Maximum Facility Amount minus the
      Advances Outstanding. The only rate stated is 0.25%, which applies at or
      below 65% utilization and only from twelve months after the Closing Date,
      so the highest rate is 0.25%. Rejected the Commitment Fee ('an aggregate
      amount equal to $250,000'). It is collected partly as 0.25% of each
      Advance, so it is an upfront fee on drawn amounts. Also rejected the
      0.125% Extension Fee.
