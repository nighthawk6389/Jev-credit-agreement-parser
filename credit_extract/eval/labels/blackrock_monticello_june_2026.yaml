assertions:

  - id: blackrock_june_maturity_names_itself_too
    family: F09_definitional_depth
    member: circular_definition
    kind: field_value
    target: revolver.maturity_date
    expect: null
    note: >
      No answer, for the same reason as the August facility: limb (ii) points
      at itself, limb (iii) is an event, and limb (i) is a Stated Maturity
      Date this exhibit does not define in the text available.

      The value of having both is that one document showing a cycle could be a
      drafting error worth reporting to a reader. Two independent facilities
      from the same sponsor using the identical wording ten months apart make
      it a convention, which is a different finding: a definition graph that
      refuses cycles will lose this field on every facility this sponsor
      writes, not on one.

  - id: blackrock_june_closing_date_is_stated
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2026-06-01
    note: >
      '"Closing Date" means June 1, 2026.' Stated, and different from the
      other facility's July 30, 2025 -- which is how the two are known to be
      separate deals rather than versions of one.

      The pair is worth keeping for that reason alone. Two exhibits from one
      sponsor with near-identical defined-term sections are exactly what a
      document-set heuristic would try to chain, and the Closing Date is the
      field that says they cannot be chained.
