# Tier 2 assertions: loanDepot, Inc. / Signature Bank, master note as amended,
# December 2022.
#
# Fit side, never read during development. One assertion, and it is the
# cleanest instance in the corpus of a criticality-5 economic term that the
# public record does not contain:
#
#   "Floor" means the benchmark rate floor, if any, provided in this Note
#   initially (as of the execution of this Note, the modification, amendment
#   or renewal of this Note or otherwise). In no event shall the Benchmark be
#   less than [***] %.
#
# The number is redacted. Not omitted, not deferred to another document, not
# spelled in a way nothing can parse -- excluded by the registrant under the
# confidential-treatment rules, with the percent sign left behind.
#
# Every other redaction in the corpus takes something structural: Lifetime
# Brands loses the definition of "Loan Documents" and part of a section
# heading, Cadeler loses unspecified identified information. This one takes a
# rate, leaves its unit visible, and so states exactly what is missing.

document: loandepot_2022
corpus_name: P_loandepot-inc-ldi_2022-12-29_0001831631-22-000380_signaturebank-loandepotxam
source: real
tier: 2

assertions:

  - id: loandepot_floor_is_redacted
    family: F03_external_reference
    member: redacted_from_filing
    kind: field_status
    target: libor_floor_pct
    expect: external_reference
    note: >
      external_reference rather than absent_from_document, and the difference
      is the whole point of the status. The Note has a floor; the filing does
      not say what it is. Reporting absence would say this facility has no
      floor, which of a 2022 note is a statement about how it behaves if rates
      go to zero.

      It is also the one case in the corpus where a pipeline can know it is
      missing something specific. "[***] %" names the type of the hole -- a
      percentage -- where a redacted definition or an unfiled schedule leaves
      no trace of what shape the answer would have had. A reader can report
      "the floor is redacted" with confidence, which is a more useful output
      than either a null or a guess.

      What stays untestable is the value, permanently: no filing states it, so
      any pipeline claiming to have resolved one is wrong by construction and
      nothing in this corpus can catch that. The register says this about fee
      letters and it is true here in a stronger form, because the redaction is
      deliberate rather than incidental.

  - id: loandepot_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  - id: loandepot_administrative_agent
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: administrative_agent.legal_name
    expect: "SIGNATURE BANK"
    note: >
      "SIGNATURE BANK, as Administrative Agent" on the cover. The
      counterweight to governing law, which is New York almost everywhere.
      This field has real variety -- sixteen distinct institutions across the
      corpus -- so a pipeline cannot look competent on it by guessing. Three
      of the sixteen are not banks: Global Loan Agency Services Limited,
      Wilmington Trust and Cantor Fitzgerald Securities are agency businesses
      rather than lenders, which is the direct-lending and project-finance
      pattern and the one a reader expecting a bank name will misread.
