# Tier 2 assertions: Eagle Point Trinity Senior Secured Lending Company, First
# Amendment to Credit Agreement, dated as of June 26, 2026.
#
# Fit side, never read during development. A BDC borrowing against a portfolio
# of senior secured loans, and the document with the hardest floor in the
# corpus:
#
#   "Floor" means a rate of interest equal to one-half of one percent (0.50%)
#   per annum.
#
# Non-zero, and spelled out before it is written down. Eighteen labelled
# documents floor at zero; Iridium floors term loans at 0.75% in plain
# numerals; this one is the only case that is both non-zero and written as
# English first. A reader that takes the first number it meets in the sentence
# gets "one", and a reader that matches a numeral gets the right answer only
# because the drafter repeated himself in parentheses.
#
# It is also the corpus's most fee-letter-dependent agreement -- twenty-six
# references -- and its headings are invisible: 13 sections detected in 637,549
# characters, on a filing whose pages are broken by .jpg images.

document: eagle_point_trinity_2026
corpus_name: C_eagle-point-trinity-senior-secured-lending-co_2026-08-14_0002027033-26-000011_ex101-firstamendmenttocr
source: real
tier: 2

assertions:

  - id: eagle_point_floor_is_fifty_basis_points_in_words
    family: F08_units
    member: bps_vs_percent
    kind: field_value
    target: libor_floor_pct
    expect: "0.50%"
    note: >
      '"Floor" means a rate of interest equal to one-half of one percent
      (0.50%) per annum.'

      The second non-zero floor in the corpus and the only one written in
      words. Valvoline's floor is the bare word "zero" and produces nothing
      from a numeric parser; this one produces 1, or 0.5, or 0.50%, depending
      on which token is reached first, and only the last is right.

      The pair matters because the two failures look identical downstream. A
      pipeline returning nothing for Valvoline and 1 for Eagle Point has one
      empty field and one criticality-5 field that is wrong by a factor of
      two hundred, and both came from the same inability to read a number
      spelled as English.

  - id: eagle_point_maturity_hangs_on_a_fused_blackline_date
    family: F05_versioning
    member: operative_version_ambiguous
    kind: field_status
    target: revolver.maturity_date
    expect: needs_review
    note: >
      '" Commitment Termination Date " means NovemberJune 1226, 20262028, or
      such later date to which the Commitment Termination Date may be
      extended'. The Maturity Date is three years after the earlier of
      clauses (b) and (c) of the Termination Date; (b) is a date the
      Borrower may select, an event, and (c) is this Commitment Termination
      Date.

      Corrected. This assertion used to expect no value because "those limbs
      are themselves events"; limb (c) is a date, but one that survives only
      fused with the date it replaced. Read deletion-first, as the rest of
      this file's fusions read, it is June 26, 2028 and the maturity is
      2031-06-26 -- both labellers reached that -- but it is an inference
      about the filing's markup, not something the text states. The right
      output is review, and a confident date of either reading is a silent
      error.

  - id: eagle_point_trinity_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: eagle_point_trinity_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_status
    target: guarantor.legal_name
    expect: absent_from_document
    note: >
      'As collateral security for the prompt, complete and indefeasible payment
      and performance in full when due, whether by lapse of time, acceleration
      or otherwise, of the Obligations, the Borrower hereby assigns, pledges and
      grants to the Administrative Agent'

      No guarantor, because the Borrower, EPT SPV 16 SUB (US) LLC, is a
      special-purpose vehicle whose only credit support is its Collateral, the
      loans it buys from the Fund under the Sale and Contribution Agreement;
      the Transaction Documents contain no guaranty and the Borrower covenants
      not to guarantee the debt of anyone else. The guarantors the text
      mentions are those of the Transferred Loans ('means, with respect to any
      Loan, the Person or Persons obligated to make payments pursuant to such
      Loan, including any guarantor thereof'), not of this facility.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: eagle_point_facility_size_survives_only_fused
    family: F05_versioning
    member: operative_version_ambiguous
    kind: field_status
    target: revolver.commitment
    expect: needs_review
    note: >
      'As of the First Amendment Effective Date, the Facility Amount is
      $60,000,00075,000,000.' The conformed copy states the size, and KeyBank's
      commitment on its signature page, with the struck figure and the new one
      run together and no mark between them. The size is almost certainly $75,000,000 --
      everywhere else in this file the deleted text comes first -- but that
      is an inference about the filing's markup, not something the text
      states. A reader that returns either half confidently has guessed.
      Both labellers saw the fusion; one inferred $75,000,000 and one skipped.

  - id: eagle_point_unused_fee_defined_in_lender_fee_letter
    family: F03_external_reference
    member: fee_letter
    kind: field_status
    target: commitment_fee_pct
    expect: external_reference
    note: >
      'Unused Fee is defined in the Lender Fee Letter'

      'The Borrower shall pay to each Managing Agent, on behalf of the related
      Lenders, on each Payment Date the Unused Fee for the related Interest
      Period in accordance with Section 2.8'

      'Lender Fee Letter means that certain Lender Fee Letter dated as of the
      date hereof, among the Borrower, the Administrative Agent and the
      Lenders'

      The agreement has an unused fee but leaves its definition and rate to the
      Lender Fee Letter, which is not in the filing; no rate appears in the
      text. Rejected: the Applicable Reduction Premium Percentage (1.00%, then
      0.00%), which is a premium on reducing the facility, not an unused fee.
