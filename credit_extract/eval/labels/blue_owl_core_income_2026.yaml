# Tier 2 assertions: Core Income Funding VII LLC (Blue Owl Credit Income
# Corp.), Amendment No. 2 to Credit and Security Agreement, dated as of
# August 20, 2026 (Exhibit 10.1).
#
# HELD OUT. Read once, to write this label, and no code was changed on its
# strength.
#
# A BDC warehouse: a special-purpose borrower funding a pool of collateral
# loans, with the pool's composition tested rather than the borrower's
# earnings. It classifies as abl_revolver at 0.85 on "borrowing base" and
# "advance rate", which are the right words for the wrong reason -- in an
# asset-based revolver they measure receivables and inventory against advance
# rates, and here they measure eligible collateral loans against the same.
#
# The consequence is specific and in the wrong direction. abl_revolver rules
# nav_tests inapplicable, and a warehouse's tests are exactly the nav_tests
# group. So the archetype that fits the vocabulary suppresses the fields the
# document actually has.
#
# This is the third document in the corpus with the shape -- Golub's
# cik1901612 on the fit side, Athena Funding III in this same batch -- which
# is what makes it a class rather than an instance.

document: blue_owl_core_income_2026
corpus_name: A_blue-owl-credit-income-corp_2026-08-25_0001193125-26-365212_d31641dex101
source: real
tier: 2

assertions:

  - id: blue_owl_core_income_closing_date_is_stated
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2024-05-21
    note: >
      '"Closing Date" means May 21, 2024.'

      Stated outright, on an amendment dated 20 August 2026. The two-year gap
      is the trap the Accelevation joinder has in miniature and Aveanna has in
      full: the document's own date is the salient one and the defined term
      points somewhere else entirely.

  - id: blue_owl_core_income_floor_is_defined_as_whatever_the_agreement_says
    family: F09_definitional_depth
    member: circular_definition
    kind: field_status
    target: libor_floor_pct
    expect: needs_review
    note: >
      '"Floor" means, with respect to any Eligible Currency, the benchmark
      rate floor, if any, provided in this Agreement initially (as of the
      execution of this Agreement, the modification, amendment or renewal of
      this Agreement or otherwise) with respect to the applicable initial
      Benchmark for such Eligible Currency.'

      The definition defines the term as whatever the agreement provides,
      which is not a definition. It is a standard LSTA benchmark-replacement
      form, so the same sentence appears in Winnebago, Bain Capital, Tailored
      Brands and New Fortress Energy -- four more documents in this batch --
      and it is the single most common Floor definition in the corpus.

      Two of those five resolve it in the next sentence: New Fortress adds
      "The Floor shall be 1.00% per annum with respect to the Term Loans" and
      Bain adds "Commencing on the Closing Date, the Floor ...". The other
      three do not, within the filing. So the right answer is not a number and
      not absent_from_document -- the term is defined, used, and its value is
      genuinely undetermined by the text. needs_review is the only honest
      terminal state: it is the one that does not claim to have settled
      anything, and it is deliberately not a confident status, so it neither
      earns credit nor spends the family's error budget.

      A pipeline that returns 0.00% here, on the grounds that the definition
      says the floor may be zero, has invented a rate.

  - id: blue_owl_core_income_page_furniture_splits_a_sentence
    family: F11_layout
    member: table_split_across_pages
    kind: text_present
    target: "g\n\n-6-\n\na"
    expect: true
    note: >
      23 page marks land between two lowercase letters -- inside a sentence
      rather than between paragraphs -- and each is surrounded by blank lines,
      so anything segmenting on paragraph breaks sees one sentence as two
      blocks. The warehouse pair carry them at a quarter of Hillman's density.
      Asserted with the exact bytes, newlines included, because the question
      is whether normalisation leaves them there and a paraphrase could not
      tell. Four renderings of one defect are now pinned across the corpus: a
      bare digit, a dashed number with spaces, one without, and an unexpanded
      Word field code.

  - id: blue_owl_core_income_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: blue_owl_core_income_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_status
    target: guarantor.legal_name
    expect: absent_from_document
    note: >
      'the obligations of the Borrower under this Agreement are limited recourse
      obligations of the Borrower (and not any of its Affiliates or any other
      party) payable solely from the Collateral'

      No guarantor, because the Borrower, Core Income Funding VII LLC, is a
      special-purpose warehouse vehicle whose only credit support is the
      Collateral it pledges under Section 7.01; Blue Owl Credit Income Corp., as
      Equityholder and Collateral Manager, gives no guaranty, and the Facility
      Documents contain none. The guarantors the text does mention belong to
      the portfolio ('means, in respect of any Collateral Asset, any Person
      obligated to pay Collections in respect of such Collateral Asset,
      including any applicable guarantors'), not to this facility.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: blue_owl_core_income_facility_amount_is_stated
    family: F06_structure
    member: nav_or_subscription_line
    kind: field_value
    target: revolver.commitment
    expect: "$500,000,000"
    note: >
      '" Facility Amount " means during the Reinvestment Period, $500,000,000 (as such amount may be reduced from time to time pursuant to Section 2.06 , increased pursuant to Section 2.22'

      The conformed Credit and Security Agreement (through Amendment No. 2)
      states the committed size; Schedule 1 with the per-lender Commitments is
      not in the text. Near misses rejected: the Section 2.22 accordion,
      'the Borrower may request one or more increases to the Facility Amount (up to, in the aggregate, $300,000,000)',
      which caps increases, and the $833,000,000 Concentration Denominator,
      which is a collateral figure.

  - id: blue_owl_core_income_final_maturity_two_years_after_reinvestment
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: revolver.maturity_date
    expect: 2029-05-21
    note: >
      '" Closing Date " means May 21, 2024'
      ; '" Reinvestment Period " means, subject to the Lender Fee Letter, the period from and including the Closing Date to and including the earliest of (a) the date that is three (3) years after the Closing Date (unless extended with the consent of the Administrative Agent and each Lender)'
      ; '" Commitment Termination Date " means the last day of the Reinvestment Period'
      ; '" Final Maturity Date " means the earliest to occur of (i) the date on which the Borrower (or the Collateral Manager on its behalf) reduces the Facility Amount in full pursuant to Section 2.06(b) ; (ii) the day that is two (2) years after the Commitment Termination Date'
      ; and Section 2.04(a) makes each Advance 'payable on the Final Maturity Date'.

      Computed: May 21, 2024 plus three years is May 21, 2027 (a Friday, so no
      Business Day roll), the last day of the Reinvestment Period and so the
      Commitment Termination Date; plus two years is May 21, 2029, a Monday, so
      no roll either. The other limbs of both earliest-of clauses are events.
      Rejected: May 21, 2027, which ends the Reinvestment Period only. The
      Reinvestment Period is stated to be subject to the Lender Fee Letter (not
      in the filing) and may be extended with the consent of the
      Administrative Agent and each Lender; the date given is the unextended
      one as the text stands.

  - id: blue_owl_core_income_commitment_fee_in_lender_fee_letter
    family: F03_external_reference
    member: fee_letter
    kind: field_status
    target: commitment_fee_pct
    expect: external_reference
    note: >
      '" Commitment Fee " has the meaning assigned to such term in the Lender Fee Letter'
      ; Section 2.12(a): 'the Borrower shall pay to the Collateral Agent (for the account of the Lenders on a pro rata basis) the Commitment Fee in the amount set forth in the Lender Fee Letter'.

      The fee on unused commitments is the Commitment Fee, and both its
      definition and the operative fee clause point to the Lender Fee Letter,
      which is not in the filing; no unused, undrawn or non-usage fee rate is
      stated in the agreement. The Prepayment Fee, also left to the Lender Fee
      Letter, is a different fee.
