# Tier 2 assertions: Sanmina Corporation, Amended and Restated Credit
# Agreement (Term A, Delayed Draw Term A, Incremental Term B-1, 2026 Term B-1
# and a multicurrency revolver).
#
# Fit side, never read during development. It supplies three things the corpus
# has never had, and one trap that only exists because of what the last batch
# taught.
#
# The trap first. BrightSpring showed that "credit spread adjustment" occurring
# zero times proves nothing, because the adjustment can be called a Term SOFR
# Adjustment two definitions away. The obvious correction is to probe for any
# defined term of the form "X Adjustment". Run that probe here and it returns
# two, both real and both non-zero:
#
#   "SONIA Adjustment" means, with respect to SONIA, 0.0326% (3.26 basis
#   points) per annum.
#   "Term CORRA Adjustment" means 0.29547% (29.547 basis points) for an
#   Interest Period of one-month's duration and 0.32138% (32.138 basis points)
#   for an Interest Period of three-months' duration.
#
# Neither is this facility's credit spread adjustment. They belong to the
# alternative currency benchmarks -- Sterling and Canadian dollars -- and the
# Term SOFR Loans have no adjustment at all: the Applicable Rate is added to
# Term SOFR directly. So the broadened probe produces a confident wrong answer
# where the narrow one produced a correct one, and the difference is which
# benchmark the adjustment attaches to rather than what it is called.
#
# They are also the corpus's first adjustments that are not zero, its first
# rate that varies by tenor (29.547 bps at one month, 32.138 bps at three),
# and its first figures stated in percent and basis points in the same breath.

document: sanmina_2026
corpus_name: B_sanmina-corp-sanm_2026-07-27_0000897723-26-000037_sanmina-ex1027x20260627
source: real
tier: 2

assertions:

  # -- F07 benchmark: adjustments that belong to other currencies ----------

  - id: sanmina_sofr_loans_have_no_adjustment
    family: F07_benchmark
    member: sofr_credit_spread_adjustment
    kind: field_status
    target: accrual.credit_spread_adjustment_pct
    expect: absent_from_document
    note: >
      "credit spread adjustment" and "spread adjustment" each occur zero
      times, and unlike BrightSpring that is the right conclusion here: the
      Term SOFR Loans carry no adjustment, and the Applicable Rate is added to
      Term SOFR itself.

      What makes this worth an assertion is the two adjustments that do exist.
      A SONIA Adjustment of 0.0326% and a Term CORRA Adjustment of 0.29547%
      or 0.32138% depending on tenor are both defined, both non-zero, and both
      belong to alternative currency benchmarks rather than to SOFR. Any rule
      of the form "find a defined term ending in Adjustment and report its
      percentage" returns one of them and is wrong -- confidently, with a
      correct citation, on a criticality-5 field.

      This is the exact correction a reader would make after BrightSpring, so
      the pair is the point: BrightSpring punishes the narrow probe and
      Sanmina punishes the broad one. What separates them is which benchmark
      the adjustment attaches to, which neither probe looks at.

  - id: sanmina_top_margin_is_pricing_level_five
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "2.000%"
    note: >
      'Pricing Level | Consolidated Total Net Leverage Ratio | Term SOFR Loans
      / Alternative Currency Loans / Letter of Credit Fees | Base Rate Loans |
      Commitment Fee: 1 < 0.75:1.00 1.375% 0.375% 0.200%; 2 > 0.75:1.00 and <
      1.25:1.00 1.500% 0.500% 0.225%; 3 > 1.25:1.00 and < 1.75:1.00 1.625%
      0.625% 0.250%; 4 > 1.75:1.00 and < 2.25:1.00 1.750% 0.750% 0.275%; 5 >
      2.25:1.00 2.000% 1.000% 0.300%.'

      Level 5 at 2.000% is the top, and the grid runs the conventional way
      round. Three distractors. The Base Rate column tops at 1.000%. The
      Applicable Rate definition also sets flat rates outside the grid -- 2.00%
      for Incremental Term B-1 Loans before the Amendment No. 3 Effective Date
      and 1.75% for the 2026 Term B-1 Loans -- so 2.00% appears twice in the
      document meaning two different things, once as the grid's worst level
      and once as a superseded flat rate on a different tranche. And Pricing
      Level 5 is reachable without leverage: it applies on request of the
      Required Pro Rata Facilities Lenders whenever a Compliance Certificate
      is late, and automatically during a payment Event of Default.

  # -- F04 absence, inverted: a sweep with a real percentage ---------------

  - id: sanmina_ecf_sweep_is_fifty_percent
    family: F04_absence
    member: no_ecf_sweep
    kind: field_value
    target: excess_cash_flow.sweep_pct
    expect: "50%"
    note: >
      'the Company shall prepay (or cause to be prepaid) the Term B Loans ...
      in an aggregate amount (the "Excess Cash Flow Calculated Amount") equal
      to the difference of (A) the product of Consolidated Excess Cash Flow
      for such year times (I) fifty percent (50%), if the Consolidated First
      Lien Net Leverage Ratio as of the end of such fiscal year is greater
      than 2.50:1.00 or (II) twenty-five percent (25%), if the ... Ratio ... is
      equal to or less than 2.50:1.00 but greater than 2.00:1.00, minus (B)
      the sum of (1) the aggregate principal amount of optional principal
      prepayments ...'.

      The first document in the corpus where this field has a value. Six
      others assert its absence, and a check that never fires passes all six,
      so until now nothing could tell a working extractor from a silent one.

      50% is the top of a three-step ladder and the answer at the worst
      leverage; 25% is the middle step and the sweep falls away entirely at or
      below 2.00:1.00, which the quoted text implies by omission rather than
      stating. The percentage is also written twice in the same clause, once
      in words and once in numerals -- "fifty percent (50%)" -- which is the
      construction the numeral_word_mismatch invariant exists to police.

  - id: sanmina_commitment_fee_at_the_top_level
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.300%"
    note: >
      Pricing Level 5 of the same grid, at leverage greater than 2.25:1.00.
      Three columns share one row here -- Term SOFR, Base Rate and Commitment
      Fee -- so a reader that has located the right row still has to pick the
      right column, and the fee column is the narrowest range in the table
      (0.200% to 0.300%) and the easiest to mistake for a rounding artefact of
      the others.

  - id: sanmina_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  - id: sanmina_administrative_agent
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: administrative_agent.legal_name
    expect: "Bank of America, N.A."
    note: >
      "Bank of America, N.A., as Administrative Agent" on the cover. The
      counterweight to governing law, which is New York almost everywhere.
      This field has real variety -- sixteen distinct institutions across the
      corpus -- so a pipeline cannot look competent on it by guessing. Three
      of the sixteen are not banks: Global Loan Agency Services Limited,
      Wilmington Trust and Cantor Fitzgerald Securities are agency businesses
      rather than lenders, which is the direct-lending and project-finance
      pattern and the one a reader expecting a bank name will misread.
