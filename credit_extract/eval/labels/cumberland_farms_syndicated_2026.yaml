# Tier 2 assertions: Cumberland Farms Ltd., Second Amendment to Syndicated
# Facility Agreement, dated as of June 23, 2026 (Exhibit 10.5).
#
# HELD OUT. Read once, to write this label, and no code was changed on its
# strength.
#
# 1,194,418 characters -- the largest document in the corpus by a quarter of a
# million -- and it contains the only genuinely circular definition found so
# far:
#
#   "Applicable ECF Percentage" means, for any Excess Cash Flow Period: (q)
#   50%, if the Consolidated First Lien Net Leverage Ratio (determined on a
#   Pro Forma Basis after giving effect to the prepayment that would be
#   required by Section 2.05(b)(i), assuming an Applicable ECF Percentage of
#   50%) as of [the last day of such period] ...
#
# The sweep percentage depends on a leverage ratio computed after applying the
# prepayment that the sweep percentage requires. The drafter saw the loop and
# cut it with "assuming an Applicable ECF Percentage of 50%" -- a stipulated
# seed value that makes the definition terminate. Strip that parenthetical and
# the term has no value at all.
#
# It also carries a proviso that overrides its own pricing grid:
#
#   Pricing Level | Consolidated First Lien Net Leverage Ratio | Commitment Fee
#   1 | Greater than 4.75:1.00                        | 0.50%
#   2 | <= 4.75:1.00 but greater than 4.25:1.00       | 0.375%
#   3 | <= 4.25:1.00                                  | 0.25%
#
#   provided, however, that "Pricing Level 1" above shall apply without regard
#   to the Consolidated First Lien Net Leverage Ratio on and after the third
#   Business Day after the date on [which a Compliance Certificate is due and
#   not delivered] ...
#
# The grid maps a ratio to a fee, and the proviso pins the answer to the
# worst level while disregarding the ratio entirely. A table-reading pass
# recovers the mapping perfectly and still returns the wrong fee whenever the
# proviso is live.

document: cumberland_farms_syndicated_2026
corpus_name: J_cumberland-farms-ltd-cmby_2026-09-04_0001193125-26-382176_d113224dex105
source: real
tier: 2

assertions:

  - id: cumberland_ecf_percentage_is_defined_in_terms_of_itself
    family: F09_definitional_depth
    member: circular_definition
    kind: field_value
    target: excess_cash_flow.sweep_pct
    expect: "50%"
    note: >
      50% is the top of the ladder and the seed the definition stipulates for
      its own circularity, which makes it the one number the definition
      supplies twice and the only one recoverable without resolving the
      leverage test.

      What is worth recording is why the circle closes. The prepayment under
      Section 2.05(b)(i) changes the ratio, and the ratio selects the
      percentage that sizes the prepayment. The parenthetical breaks it by
      fiat. A definition-graph walk that treats the parenthetical as ordinary
      qualifying text -- which it looks like -- either loops or reports the
      term unresolved, and the one thing it must not do is silently pick the
      first percentage it meets.

  - id: cumberland_commitment_fee_grid_is_overridden_by_its_proviso
    family: F02_precedence
    member: table_overrides_definition
    kind: field_value
    target: commitment_fee_pct
    expect: "0.50%"
    note: >
      Pricing Level 1, and the assertion is deliberately the level the proviso
      forces rather than the level a ratio would select, because the proviso
      makes Level 1 the answer in the one state a filing cannot rule out: the
      Compliance Certificate not having been delivered.

      Aveanna is the companion in this batch with the override running the
      other way -- a notwithstanding that lowers the margin below the table.
      Between them the two documents show that the table is neither a floor
      nor a ceiling on the truth, and that precedence has to be read in both
      directions.

  - id: cumberland_maturity_springs_on_other_debt
    family: F10_conditionality
    member: springing_on_trigger
    kind: field_status
    target: revolver.maturity_date
    expect: needs_review
    note: >
      '"Maturity Date" means (a) with respect to the Revolving Credit
      Facility, the earlier of (i) five year anniversary of the Closing Date;
      provided that if on any date prior to the five year anniversary of the
      Closing Date (any such date, a "Reference Date"), any Springing
      Indebtedness remains outstanding ...'

      The Closing Date is stated -- February 10, 2026 -- so the five-year
      anniversary resolves to 10 February 2031 arithmetically. It is still not
      the maturity date, because the springing branch can pull it earlier and
      whether it does depends on facts outside the document.

      needs_review is the honest state and 2031-02-10 is the confident wrong
      answer available to anyone who resolves the anniversary and stops at the
      semicolon. Tailored Brands and Winnebago in this same batch spring on
      the same structure -- 91 days before some other instrument's maturity --
      so three of the twenty held-out documents have a maturity that is not
      the date they state.

  - id: cumberland_mfn_threshold_is_stated_in_basis_points
    family: F08_units
    member: bps_vs_percent
    kind: field_value
    target: mfn_threshold_pct
    expect: "0.75%"
    note: >
      The MFN trigger is written in basis points and the field holds a
      percent: the incremental margin may not exceed the Initial Term Loans'
      margin "by more than 75 basis points, then the interest rate margin with
      respect to the Initial Term Loans of a like currency ... shall be
      increased". 75 basis points is 0.75%, and the document never writes that
      figure. Every other MFN threshold a reader meets is quoted as a
      percentage, so this is the conversion the field forces and the one place
      a factor of a hundred would pass unnoticed -- 75% is not an absurd-
      looking number in a document full of percentages.

  - id: cumberland_mfn_sunsets_after_six_months
    family: F04_absence
    member: no_mfn_sunset
    kind: field_value
    target: mfn_sunset
    expect: 2026-08-10
    note: >
      The MFN applies only to a facility "that is incurred on or prior to the
      date that is six (6) months after the Closing Date", and the Closing
      Date is stated: February 10, 2026. Six months is 10 August 2026. This is
      F04's positive case and the corpus has had only negatives. The Meridian
      fixture asserts an MFN with no sunset; this is an MFN with one,
      computable, from two facts in different definitions. Reporting
      absent_from_document here would say the protection runs for the life of
      the facility, which is the error the fixture's assertion exists to make
      visible from the other direction.

  - id: cumberland_margin_steps_down_only_after_an_ipo
    family: F10_conditionality
    member: post_ipo_only
    kind: text_present
    target: "at all times following the consummation of a Qualified IPO, the Applicable Rate otherwise applicable pursuant to the preceding provisions shall be reduced by 0.25%"
    expect: true
    note: >
      F10's post_ipo_only member, and the first real instance in the corpus.
      The Applicable Rate is set by a three-level commitment-fee grid earlier
      in the same definition, and this sentence reduces whatever that grid
      produces by a quarter point, permanently, on an event that may never
      happen. Asserted as text because the field holds one number and the
      document has two: the grid's and the grid's minus 0.25%. Which is
      operative depends on a corporate event, so neither is the rate.
      Aveanna's ratings-based reduction is the same shape keyed to a rating
      rather than an IPO, and Cumberland carries both a notwithstanding that
      lowers the rate and a proviso that pins its commitment fee to the worst
      level -- overrides in both directions in one agreement.

  - id: cumberland_farms_syndicated_page_furniture_splits_a_sentence
    family: F11_layout
    member: table_split_across_pages
    kind: text_present
    target: "s\n\n5\n\nt"
    expect: true
    note: >
      57 page marks land between two lowercase letters -- inside a sentence
      rather than between paragraphs -- and each is surrounded by blank lines,
      so anything segmenting on paragraph breaks sees one sentence as two
      blocks. Cumberland writes them without spaces, "-21-", where Bain writes
      "- 34 -" and KBR a bare digit. Asserted with the exact bytes, newlines
      included, because the question is whether normalisation leaves them
      there and a paraphrase could not tell. Four renderings of one defect are
      now pinned across the corpus: a bare digit, a dashed number with spaces,
      one without, and an unexpanded Word field code.

  - id: cumberland_farms_syndicated_carries_several_business_day_conventions
    family: F08_units
    member: ratio_formatting
    kind: text_present
    target: "immediately preceding Business Day"
    expect: true
    note: >
      This agreement uses 5 different business day conventions: immediately
      preceding business day 8; next succeeding business day 7; next preceding
      business day 3; immediately succeeding business day 3; next following
      business day 1. 11 roll forward and 11 roll backward. So the convention
      is a property of a term, not of a document, and "the business day
      convention" is a question this filing does not answer. Five conventions
      -- the most of any document here, in the longest document here.
      Corrected from an earlier reading that took one proviso for the
      document's rule. The assertion targets the most frequent phrasing
      because that is the one a sampling reader would meet first -- and on
      several of these documents it is not the one that governs the maturity.

  - id: cumberland_farms_syndicated_closing_date_is_stated
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2026-02-10
    note: >
      " Closing Date " means February 10, 2026. Stated outright, which is the
      shape that resolves -- against the eleven in this corpus that give an
      event instead and never resolve at all, and against Latham's, which
      gives both. The anchor the MFN sunset counts six months from, so this
      assertion and cumberland_mfn_sunsets_after_six_months stand or fall
      together -- which is the point of asserting both rather than only the
      derived one.

  - id: cumberland_farms_syndicated_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  - id: cumberland_farms_syndicated_has_two_administrative_agents
    family: F01_integrity
    member: doubly_defined_term
    kind: field_value
    target: administrative_agent.legal_name
    expect: "JPMorgan Chase Bank, N.A."
    note: >
      The cover names two: "JPMorgan Chase Bank, N.A. and J.P. Morgan SE, as
      Administrative Agent" -- a US entity and its European affiliate, both
      holding the role, because the facility is multi-currency and a euro-
      denominated tranche needs an agent inside the EU. The field holds one
      name and the document gives two, so the assertion picks the US entity
      and records that the choice is a convention rather than a reading.
      Tailored Brands has the same structure with a Canadian affiliate --
      "JPMORGAN CHASE BANK, N.A. TORONTO BRANCH, as Canadian Administrative
      Agent" -- but there the roles are separately titled, so the field is not
      forced to choose. Here they are not.
