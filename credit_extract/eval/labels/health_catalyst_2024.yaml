# Tier 2 assertions: Health Catalyst / Silver Point, 16 July 2024.
#
# SEC EDGAR exhibit 10.1. A senior secured recurring-revenue facility: a
# $125,000,000 closing-date term loan plus $100,000,000 of delayed draw, split
# into a $40,000,000 A tranche and a $60,000,000 B tranche.
#
# Every expectation below was read out of the filing before it was run through
# the pipeline. Where the pipeline does not yet reach the answer, the assertion
# stays and fails: an eval written to what the code currently does measures
# nothing. A failure here is only a *silent* error when the pipeline also
# claimed the field was settled, which is the number the family report gates on.
#
# What makes this document worth having:
#
#   * it has no Consolidated EBITDA at all -- not a low count, zero -- and
#     covenants on Recurring Revenue instead. Every EBITDA-shaped field must
#     come back not_applicable_to_archetype rather than absent;
#   * 70 terms are blacked out under Item 601(b)(10). They are redactions, not
#     external references: the borrower has them and so does the Commission.
#     Conflating the two is what section 7 of the spec exists to prevent;
#   * SECTION 3 is reserved and Section 5.2 refers to Section 3.1 twice.

document: health_catalyst_2024
source: real
tier: 2
archetype: recurring_revenue

assertions:
  # -- F06 structure: the field model differs by archetype -----------------
  - id: hc_archetype_is_recurring_revenue
    family: F06_structure
    member: recurring_revenue_arr
    kind: archetype
    expect: recurring_revenue
    note: >
      "Recurring Revenue" is a defined term and "ARR Leverage" is decisive
      vocabulary: the ARR Leverage Covenant in Section 7.1(a) is the operative
      financial covenant. That is what makes this an ARR deal, and it is not
      the same claim as the agreement having no EBITDA -- see the two
      assertions below, which originally said so and were wrong.

  # These two replace assertions that expected not_applicable_to_archetype on
  # the reasoning "zero occurrences of Consolidated EBITDA in 571,000
  # characters". That string search is accurate and the inference from it is
  # not: this agreement defines "Consolidated Adjusted EBITDA" -- 53
  # occurrences, 63 of "EBITDA" -- with a nineteen-clause add-back ladder and a
  # "Shared Cap" of 25% over clauses (v), (xi), (xiii), (xvii) and (xix). An
  # ARR loan covenanted on revenue still needs EBITDA for its baskets, and
  # Health Catalyst carries both.
  #
  # The labels mattered more than the wording. Had the code been changed to
  # satisfy them, it would have learned to suppress a real, capped add-back
  # structure under not_applicable_to_archetype -- a confident status -- which
  # is the exact silent error this project exists to prevent, in the same shape
  # as the Air T case that motivated the evidence veto.

  - id: hc_ebitda_addback_cap_is_the_shared_cap
    family: F06_structure
    member: recurring_revenue_arr
    kind: field_value
    target: consolidated_ebitda.addback_cap_pct
    expect: "25%"
    note: >
      '"Shared Cap": with respect to any period, an amount equal to 25% of
      Consolidated Adjusted EBITDA for such period (calculated before giving
      effect to any such add-backs or adjustments set forth in clauses (v),
      (xi), (xiii), (xvii) and (xix) of clause (a) of the definition of
      Consolidated Adjusted EBITDA).' Clause (xix) is the run-rate cost
      savings, operating expense reductions and synergies add-back, so the
      cost-savings cap this field asks for is the Shared Cap, at 25%. The cap
      is measured against EBITDA before the capped add-backs are applied,
      which is the convention that makes a bare "25%" ambiguous and is why it
      is written out here.

  - id: hc_ebitda_clause_cap_is_absent
    family: F06_structure
    member: recurring_revenue_arr
    kind: field_status
    target: consolidated_ebitda.addback_cap_clause_a_xvi
    expect: absent_from_document
    note: >
      This agreement has no cap at clause (a)(xvi). Clause (a)(xvi) here is
      proportionate attribution of a joint venture's income, and it is not in
      the Shared Cap list. The run-rate synergies add-back that this field is
      named for sits at clause (a)(xix) instead, and its cap is the 25% Shared
      Cap already asserted above.

      Absent rather than 25%, deliberately. A clause reference is the only
      thing distinguishing this field from addback_cap_pct, so reporting the
      right number against a clause that does not contain it would put a
      correct value behind a citation that does not support it -- which is the
      one move no tier here is allowed to make. The clause-numbered field is a
      registry convention that assumes a drafting order this agreement does
      not follow.

  - id: hc_no_borrowing_base
    family: F06_structure
    member: recurring_revenue_arr
    kind: field_status
    target: borrowing_base.advance_rate_accounts
    expect: not_applicable_to_archetype
    note: the phrase "borrowing base" does not occur in this agreement

  # -- F01 integrity: defects that parse cleanly ---------------------------
  - id: hc_reserved_section_is_still_referenced
    family: F01_integrity
    member: broken_cross_reference
    kind: invariant_fired
    target: cross_references_resolve
    expect: true
    note: >
      The document prints "SECTION 3 [RESERVED]" and then Section 5.2 refers
      to "Section 3.1 (and not Section 3.2)" twice. Also 6.11 [Reserved],
      cited by the security-document definition.

  # -- F02 precedence ------------------------------------------------------
  - id: hc_definitions_stack_provisos
    family: F02_precedence
    member: stacked_provisos
    kind: invariant_fired
    target: proviso_depth_is_readable
    expect: true
    note: five provisos in one provision of the defined-terms article

  # -- F07 benchmark: the rate is composed ---------------------------------
  - id: hc_term_sofr_with_no_csa_is_not_a_finding
    family: F07_benchmark
    member: sofr_credit_spread_adjustment
    kind: invariant_fired
    target: csa_not_silently_zero
    expect: false
    note: >
      Priced off Term SOFR with no credit spread adjustment stated anywhere,
      and the margin -- 6.50% on SOFR loans -- absorbs it. Zero is the correct
      reading. This assertion originally expected the check to fire, which is
      what the check then did; measured across a hundred agreements it fires
      on about forty that correctly have no adjustment, which made it the
      loudest and least informative check in the suite. It now fires only when
      an adjustment is stated with a figure and no value came back.

  - id: hc_applicable_margin_on_sofr_loans
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: 6.50
    note: >
      '"Applicable Margin": for the Initial Loans and the Delayed Draw Loans,
      (i) with respect to SOFR Loans, 6.50% per annum, and (ii) with respect to
      ABR Loans, 5.50% per annum.' Flat, not a grid.

  # -- F08 units -----------------------------------------------------------
  - id: hc_initial_commitment
    family: F08_units
    member: thousands_vs_millions
    kind: field_value
    target: initial_term_loan.commitment
    expect: 125000000
    note: '"The initial aggregate amount of the Initial Commitments is $125,000,000."'

  - id: hc_delayed_draw_commitment
    family: F08_units
    member: thousands_vs_millions
    kind: field_value
    target: delayed_draw.commitment
    expect: 100000000
    note: $40,000,000 of Delayed Draw A plus $60,000,000 of Delayed Draw B

  # -- F10 conditionality --------------------------------------------------
  - id: hc_maturity_date
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: initial_term_loan.maturity_date
    expect: 2029-07-16
    note: >
      '"Maturity Date": July 16, 2029, as extended in accordance with any
      Extension Amendment, solely with respect to any Extended Loans governed
      thereby.' The extension is a conditional variant, not a different date.

      This assertion FAILS today, and the reason is worth keeping written
      down rather than rediscovering. The registry anchors the field on
      "Initial Term Loan Maturity Date", which is what the synthetic Meridian
      fixture calls it and which occurs zero times in this agreement -- Health
      Catalyst writes '" Maturity Date ": July 16, 2029' at offset 134,387,
      using the colon convention. So the rule cannot fire, the field routes to
      needs_review, and nothing is asserted wrongly; this is a recall miss,
      not a silent error, which is why the family reads 0 pass / 1 fail while
      the silent-error rate stays at zero.

      Do not fix it by adding "Maturity Date" to the anchors. Across the 103
      corpus documents there are 44 distinct defined terms ending in "Maturity
      Date" -- "Latest Maturity Date" in 14 documents, "Term Loan Maturity
      Date" in 9, "Stated Maturity Date" in 6 -- and the registry's anchor
      occurs in 2. The next agreement will spell it a forty-fifth way. That
      tail is what the model tier is for, so the assertion stays red on
      purpose, as the measurement of a gap a credential closes.

  # -- coverage ------------------------------------------------------------
  - id: hc_uncaptured_content_is_swept
    family: F01_integrity
    member: undefined_term_used
    kind: report_count
    target: orphan_chunks
    expect: 171
    note: >
      Recall on this document is low and the orphan sweep is what says so.
      This number is a tripwire, not a target: if it moves, either extraction
      improved or the sweep stopped working, and the two must not be confused.

  # -- F09 definitional depth ----------------------------------------------
  #
  # F09 was the register's only untested family, which is awkward: it is the
  # one this project's thesis leads with. A credit agreement is a program
  # written in English, and extracting a covenant without the chain of
  # definitions beneath it is extracting a symbol rather than a number.
  #
  # It was untested because the graph saw nothing here. On 571,000 characters,
  # whose defined-terms article alone runs to 189,000, it found ONE term.
  # EDGAR filings set a defined term as its own styled run, so the quotes and
  # the term arrive separately and the normalizer writes `" Floor "`, not
  # `"Floor"` -- and the pattern required the term to begin immediately after
  # the quote. This agreement also writes its definitions with a colon rather
  # than "means", which is a drafting convention rather than a variant: ten of
  # twenty-five corpus agreements use it, four almost exclusively, at 317 to
  # 491 colon definitions against 5 to 9.
  #
  # With both handled the graph finds 361 terms, 880 edges, 197 of them three
  # or more definitions deep, and 42 circular definitions.

  - id: hcd_leverage_ratio_resolves_to_its_components
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: closure_contains
    target: ARR Net Leverage Ratio
    expect:
      - Consolidated Funded Indebtedness
      - Unrestricted Cash
      - LQA Recurring Revenues
      - Capital Lease Obligations
    note: >
      '"ARR Net Leverage Ratio": as of any date of determination, the ratio of
      (a) (i) Consolidated Funded Indebtedness as of such date minus (ii)
      Unrestricted Cash on such date to (b) LQA Recurring Revenues ...'
      Three of the four are named in the definition itself; Capital Lease
      Obligations is reached only through Consolidated Funded Indebtedness,
      which is the point of computing a closure rather than reading one line.

  - id: hcd_the_graph_is_deep
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: report_count
    target: definition_deep_terms
    expect: 193
    note: >
      Terms whose meaning is three or more definitions below the surface. A
      tripwire on the graph, not a target: if it collapses, the parser has
      stopped reading this document's drafting convention again.

      This assertion is also how the depth computation was found to be
      non-deterministic: it returned 197, 196 and 194 on three consecutive
      runs of the same document, because `uses` is a set whose iteration order
      varies under hash randomisation, and an edge back into a term already on
      the path contributes nothing -- so a different traversal broke each
      cycle at a different edge. 193 is now stable across processes.

  - id: hcd_definitions_are_found_at_all
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: report_count
    target: definition_terms
    expect: 361
    note: one, before the quote-spacing and colon conventions were handled

  - id: hcd_circular_definitions_are_found
    family: F09_definitional_depth
    member: circular_definition
    kind: report_count
    target: definition_cycles
    expect: 42
    note: >
      '"Accounting Change": is defined in the definition of "GAAP."' and GAAP
      in turn reads 'In the event that any "Accounting Change" (as defined
      below) shall occur ...'. Each sends the reader to the other. Ordinary
      drafting residue, 42 of them in this agreement, and a resolver that
      follows one without noticing does not terminate.

      Counted, not raised. `definition_graph_cycles` is named in F09's
      defended_by but is a mechanism producing a statistic, not a registered
      invariant, so no cycle here reaches the violations list -- a reader sees
      the count only in verbose output. That is defensible at 42 per document,
      where raising each one would be the referenced-schedules mistake again;
      what is not yet built is raising the ones an extraction target's closure
      actually passes through, which are the ones that bite.

  - id: hcd_external_terms_do_not_reach_a_field
    family: F09_definitional_depth
    member: term_defined_in_other_loan_document
    kind: report_count
    target: external_references
    expect: 0
    note: >
      Zero, and that is the honest number rather than a good one. The graph
      marks "Recurring Revenue" and "Excluded Lender" as reaching outside the
      agreement, but no extraction target depends on either, so nothing is
      reported as an external reference. The register keeps this member as a
      blind spot for exactly that reason: the mechanism is exercised and its
      effect on a field is not.
