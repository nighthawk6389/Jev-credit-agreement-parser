  - id: rezolve_financials_have_no_archetype
    family: F06_structure
    member: second_lien
    kind: archetype
    expect: unknown
    note: >
      Zero Events of Default, so the guard declines before any vocabulary is
      counted. That ordering is the whole design: the question "what kind of
      deal is this" is only answerable once "is this a deal" has been answered
      yes, and the classifier used to answer the second question first.

  - id: rezolve_facility_size_belongs_to_another_document
    family: F03_external_reference
    member: schedule_omitted_from_filing
    kind: field_status
    target: revolver.commitment
    expect: external_reference
    note: >
      "credit facilities of $50.0 million" is stated, correctly quoted, and
      not this document's term. The agreement it belongs to has been amended
      seven times and none of the seven is in the filing.

      Paired deliberately with greenfire_facility_size_belongs_to_another_
      document, which pins the same status on the same figure in a different
      kind of filing. Two documents, two regulators, one number, and in
      neither case does the corpus contain the agreement -- which is what
      external_reference is for and why absent_from_document would be a lie
      in both directions at once.
