# Tier 2 assertions: ATII Holdings Inc., warrant (Exhibit 4.9), September 2026.
#
# Fit side, never read during development. The fifth document in the harvest
# that is not a credit agreement, and the first that is not even a contract
# between a borrower and a lender:
#
#   THIS WARRANT AND THE SHARES ISSUABLE HEREUNDER HAVE NOT BEEN REGISTERED ...
#
# A warrant to purchase shares. 33,363 characters, no facility, no borrowing,
# every vocabulary probe empty.
#
# Five of roughly sixty-five documents read so far are not credit agreements:
# an acquisition report, an equity purchase agreement, an earnings release, a
# stock transfer agreement and this warrant. Two more are visible in the same
# category. The harvest was stratified by filer and form type, and this is
# what that selects when the target is "credit agreements".

document: atii_warrant_2026
corpus_name: G_atii-holdings-inc-nano_2026-09-02_0001104659-26-104734_none-20260902xex4d9
source: real
tier: 2

assertions:

  - id: atii_has_no_archetype
    family: F06_structure
    member: abl_borrowing_base
    kind: archetype
    expect: unknown
    note: >
      A warrant. The classifier returns unknown at 0.21 on its own, as it does
      for the press release and the stock transfer agreement -- the three
      non-agreements with no facility vocabulary at all.

      Only the two that described a facility or a subscription business drew a
      confident answer, which is the measurement worth keeping from these five
      labels: the classifier does not distinguish documents from agreements,
      and whether that matters depends entirely on what the document happens
      to talk about.

  - id: atii_warrant_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "California"
    note: >
      "governed by and construed in accordance with the laws of the State of
      California" The corpus is near-uniform on this field and that is what
      makes it worth asserting at scale: of the agreements that state a
      governing law, all but five say New York. The five are the meaningful
      negatives -- Cadeler's LMA facility (English law), KNOT Offshore's
      (Norwegian law), ATII's warrant (California) and ProFrac's two stock
      transfers (Delaware) -- and four of the five are documents that are not
      US credit agreements. A field whose answer is the same 90% of the time
      is exactly where a pipeline looks competent by guessing, and where the
      only evidence that it is reading rather than guessing is the handful of
      documents where the answer differs.
