# Tier 2 assertions: Blue Owl Technology Income Corp., Fourth Amendment to
# Senior Secured Credit Agreement, dated as of September 10, 2026.
#
# Fit side, never read during development. Labelled as the pair to Fidelity
# Private Credit: two BDC facilities, two different sponsors, two different
# agent banks, and the same three provisions almost word for word --
#
#   "Floor" means zero percent (0.00%).
#   "Maturity Date" means the earliest to occur of (a) [a stated date] and
#   (b) the date on which all Commitments have been terminated ...
#   (b) Asset Coverage Ratio. The Borrower will not permit the Asset Coverage
#   Ratio to be less than 1.50 to 1 at any time.
#
# The pair is worth having because it establishes that these are conventions
# rather than quirks. A single document showing an Asset Coverage Ratio in
# place of a leverage covenant could be a drafting choice; two unrelated BDCs
# with identical wording make it the shape of the product, which is what the
# archetype machinery would need to learn if a BDC profile is ever added.

document: blue_owl_technology_2026
corpus_name: R_blue-owl-technology-income-corp_2026-09-15_0001193125-26-391951_d96120dex101
source: real
tier: 2

assertions:

  - id: blue_owl_tech_has_no_leverage_covenant
    family: F04_absence
    member: no_financial_covenant
    kind: field_status
    target: financial_covenant.level
    expect: absent_from_document
    note: >
      The Asset Coverage Ratio floor of 1.50 to 1 is the 1940 Act limit and is
      assets over debt, so it constrains leverage in the opposite direction
      and at the opposite end of the fraction. Identical to Fidelity's.

      Reported as a maximum leverage level, 1.50 says the fund is capped at a
      turn and a half; what the clause requires is that assets stay half again
      the size of borrowings, which permits roughly two turns.

  - id: blue_owl_tech_maturity_resolves
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: revolver.maturity_date
    expect: 2031-09-10
    note: >
      '"Maturity Date" means the earliest to occur of (a) September 10, 2031
      and (b) the date on which all Commitments have been terminated and the
      aggregate amount of Loans outstanding has been repaid in full ...'.

      "Earliest to occur of" with one dated limb and one termination event,
      which resolves to the date -- the same construction and the same
      resolution as Fidelity's, and the opposite outcome from Eagle Point's,
      whose limbs are both events.

      Three documents, one phrase, two answers. What decides it is whether any
      limb carries a date, which is a property of the limbs rather than of the
      phrase, so a rule keyed to "earliest to occur of" learns nothing useful.

  - id: blue_owl_technology_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: blue_owl_technology_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: guarantor.legal_name
    expect:
      - "OR TECH LENDING IC LLC"
      - "ORTIC BC 1 LLC"
      - "ORTIC BC 2 LLC"
      - "ORTIC BC 3 LLC"
      - "ORTIC BC 4 LLC"
      - "OTIC BC 5 LLC"
      - "OTIC BC 6 LLC"
      - "OTIC BC 7 LLC"
      - "OTIC BC 8 LLC"
      - "OTIC BC 9 LLC"
      - "OTIC BC 10 LLC"
      - "OTIC BC 11 LLC"
      - "OTIC BC 12 LLC"
    note: >
      'solely with respect to Section 5.9 herein, the SUBSIDIARY GUARANTORS
      party hereto' -- and Section 5.9: 'Each Subsidiary Guarantor executing
      this Amendment solely with respect to this Section 5.9 hereby confirms'
      that its Guarantee under the Guarantee and Security Agreement continues.

      The thirteen LLCs that sign under 'Agreed and acknowledged solely with
      respect to Section 5.9' are therefore the Subsidiary Guarantors, named in
      this text even though the definition itself sends the reader to the
      Guarantee and Security Agreement. The Borrower signs only as Borrower.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: blue_owl_tech_largest_revolving_tranche_is_multicurrency
    family: F06_structure
    member: nav_or_subscription_line
    kind: field_value
    target: revolver.commitment
    expect: "$900,000,000"
    note: >
      'Multicurrency Commitments as of the Fourth Amendment Effective Date is $ 900,000,000'
      ; 'Dollar Commitments as of the Fourth Amendment Effective Date is $25,000,000'
      ; '" Revolving Commitments " means, collectively, the Dollar Commitments and the Multicurrency Commitments'.

      Two revolving tranches. The text states each tranche aggregate but no
      single figure for the Revolving Commitments, so under the tranche rule
      this is the larger one, the Multicurrency tranche; the Dollar tranche is
      $25,000,000, and the two were not added. Near misses rejected: the cover
      page figure $ 975,000,000, a facility total the text never breaks down
      (Initial Term Loans of $50,000,000 are also outstanding); the
      $1,462,500,000 cap on Commitment Increases; the $200,000,000 Swingline
      Loan limit. The Schedule I commitments (Exhibit B) are not in the text.

  - id: blue_owl_tech_term_benchmark_margin_is_flat
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "1.875%"
    note: >
      '" Applicable Margin " means: (a) with respect to any ABR Loan, 0.875% per annum; (b) with respect to any Term Benchmark Loan, 1.875% per annum and (c) with respect to any RFR Loan, 1.875% per annum'

      A single level with no grid, applying to Term Benchmark (Term SOFR) and
      RFR loans, revolving and term alike. Rejected: the 0.875% ABR margin,
      and the 0.10% Term SOFR Credit Adjustment Spread, which is part of Term
      SOFR rather than margin.

  - id: blue_owl_tech_term_sofr_floor_is_zero
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.00%"
    note: >
      'provided , that if Term SOFR determined as provided above (including pursuant to the proviso under clause (a) or (b) above) shall ever be less than zero, then Term SOFR shall be deemed to be zero'

      A zero floor on Term SOFR (which here includes the 0.10% credit
      adjustment spread). The defined term '" Floor " means zero percent (0.00%)'
      is used for Benchmark Replacements and agrees. The Alternate Base Rate
      also has a zero floor, which is a base-rate floor and was not the source.

  - id: blue_owl_tech_commitment_fee_is_flat
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.350%"
    note: >
      'a commitment fee, which shall accrue at a rate per annum equal to 0.350% on the average daily unused amount of the Dollar Commitment and Multicurrency Commitment'

      A flat rate on the unused revolving commitments of both tranches, with
      no utilization or time step. Rejected: the letter of credit fees in
      Section 2.11(b), including the participation fee at the Term Benchmark
      margin.
