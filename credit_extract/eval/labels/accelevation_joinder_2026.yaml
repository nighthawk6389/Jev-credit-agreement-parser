# Tier 2 assertions: Accelevation, Joinder Agreement and First Amendment to
# Credit Agreement dated as of September 5, 2025 (Exhibit 10.2), filed in the
# same submission as the credit agreement it amends.
#
# Fit side, never read during development. 892,000 characters against the
# agreement's 867,000: the amendment carries the whole conformed text behind a
# 25,000-character wrapper, so the two documents are very nearly the same
# document.
#
# They contain the same three occurrences of "junior lien", in the same order,
# in the same sentences. The classifier called Exhibit 10.1 a second lien term
# loan at 0.70 and this one unknown at 0.00.
#
# The difference is arithmetic. Decisive vocabulary is searched in the first
# 30,000 characters, and the amendment's wrapper pushes the exhibit index --
# where "Form of Junior Lien Intercreditor Agreement" sits -- past the end of
# the window. The classifier was not reading a different deal; it was reading
# a different 30,000 characters.
#
# That is worth a label of its own even though the signal has since been
# demoted, because the window did not go away. Every decisive phrase is still
# searched in a prefix, and any document that arrives with a preamble in front
# of it is a document the classifier reads from a different starting point.
# Conformed amendments are the normal case here, not the exception: Wheels Up,
# Hornbeck, Compass Diversified and nScale all file one.

document: accelevation_joinder_2026
corpus_name: A_accelevation-holdings-corp_2026-09-02_0001628280-26-060083_exhibit102-sx1
source: real
tier: 2

assertions:

  - id: accelevation_joinder_agrees_with_the_agreement_it_conforms
    family: F06_structure
    member: second_lien
    kind: archetype
    expect: unknown
    note: >
      Paired with accelevation_is_not_a_second_lien. Before the junior-lien
      demotion these two assertions had different answers on near-identical
      text and only one of them was wrong; the pair pins that they now agree,
      and that a regression has to break both to pass.

      The general proposition this stands for: two documents whose operative
      text is the same should classify the same, and a classification that
      moves when a preamble is prepended is a classification of the preamble's
      position.

  - id: accelevation_joinder_carries_the_same_closing_date
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2025-01-02
    note: >
      '"Closing Date" shall mean January 2, 2025.'

      The amendment is dated September 5, 2025 and conforms an agreement whose
      Closing Date is January 2, 2025, and both dates are on its face. The
      trap is that the later date is the one in the title and the first one a
      reader meets; the Closing Date is 19 characters inside a definition 60
      pages in. Wheels Up is the same shape with the amendment's own date
      winning, so the two documents disagree about which date a reader should
      reach for, which is the point: the answer is not "the later date" or
      "the title date" but the defined term.

  - id: accelevation_joinder_floor_is_stated
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.75%"
    note: >
      " Floor " shall mean 0.75% per annum. Stated outright and unconditional
      -- the shape that resolves, against the five documents whose Floor is
      defined as "the benchmark rate floor, if any, provided in this
      Agreement" and only two of those resolve in a trailing sentence. The
      joinder carries the agreement's floor unchanged, which is the control on
      the pair: same text, same value, and an archetype that differed only
      because a preamble moved a phrase past the detection window.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: accelevation_joinder_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: guarantor.legal_name
    expect: ["ACCELEVATION INTERMEDIATE LLC", "ACCELEVATION BUYER LLC", "Accelevation Holding Company LLC", "Accelevation Holdings Blocker, LLC", "Accelevation Blocker, Inc.", "Instor Blocker, Inc."]
    note: >
      'Instor Blocker, Inc., a Delaware corporation (" Instor Blocker " and,
      together with Holdings, Intermediate Holdings, Accelevation Holding,
      Accelevation Holdings Blocker and Accelevation Blocker, the " Parent
      Guarantors ")'

      The preamble of the conformed Credit Agreement (Exhibit A) names these
      six entities as the Parent Guarantors, and the Guarantors definition
      makes Holdings a Guarantor in terms ('and (iii) Holdings; provided that
      in no event shall any Excluded Subsidiary be required to be a
      Guarantor'). Any other Guarantor is identified only as a party to the
      Guarantee (Exhibit B), and neither that document nor the guarantor
      reaffirmation the amendment calls for is in this text.

  # Labelled from the text, without the pipeline's answer, to measure how
  # often the reader hands validator A a wrong value (the seventh pass).

  - id: accel_joinder_itl_commitment
    family: F06_structure
    member: delayed_draw_multi_tranche
    kind: field_value
    target: initial_term_loan.commitment
    expect: "$200,000,000"
    note: >
      'The aggregate amount of the Initial Term Loan Commitments as of the Closing Date is $200,000,000.'

      The conformed agreement attached to the September 5, 2025 Joinder Agreement and First Amendment keeps the closing-date initial term loan commitment at $200,000,000. Rejected the $20,000,000 Amendment No. 1 Incremental Term Loans (a post-closing incremental, though fungible with and deemed Initial Term Loans) and the $75,000,000 delayed draw facility.

  - id: accel_joinder_revolver_commitment_not_stated
    family: F05_versioning
    member: operative_version_ambiguous
    kind: field_status
    target: revolver.commitment
    expect: needs_review
    note: >
      'provided that such Initial Revolving Credit Commitments shall be
      increased in the amount of the Amendment No. 1 Incremental Revolving
      Credit Commitment on the Amendment No. 1 Effective Date'

      The $50,000,000 closing-date revolving commitments are increased by
      Amendment No. 1's $10,000,000 incremental revolving commitments, of the
      same class. The total in effect, $60,000,000, is printed nowhere, and the
      labelling guide never adds figures up. A reader that confirms $50,000,000
      has reported a superseded amount; review is the honest answer.

  - id: accel_joinder_ticking_fee
    family: F08_units
    member: bps_vs_percent
    kind: field_value
    target: ticking_fee_pct
    expect: "1.00%"
    note: >
      'a ticking fee equal to 1.00% per annum of the average daily unused amount of such Delayed Draw Term Loan Lender'

      Section 4.1(f) of the conformed agreement is unchanged by the amendment: a flat 1.00% per annum on unused Delayed Draw Term Loan Commitments. Rejected the 0.125% letter of credit fronting fee in Section 4.1(d).
