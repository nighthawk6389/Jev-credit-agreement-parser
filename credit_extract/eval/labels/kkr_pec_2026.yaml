# Tier 2 assertions: KKR Private Equity Conglomerate LLC, Amended and Restated
# Credit Agreement, September 2026.
#
# Fit side, never read during development. Kept for two definitions.
#
#   "Floor" means zero (0).
#
# A word, then a bare numeral in parentheses, and no percent sign anywhere. The
# corpus now holds nine renderings of a zero floor and this is the only one
# with no unit at all -- "0" could be zero per cent or zero of anything, and
# the field is typed as a percent. Valvoline's bare word "zero" at least
# carries no misleading digit; this one supplies a number a parser can take and
# no unit to scale it by.
#
#   "Closing Date" means the date of initial funding of Loans under the
#   Existing Credit Agreement.
#
# An undated event located in a different agreement. The corpus has eight
# documents whose Closing Date is an event and this is the first where the
# event happened under an instrument that is not this one and is not filed --
# so it is unresolvable twice over.

document: kkr_pec_2026
corpus_name: F_kkr-private-equity-conglomerate-llc_2026-09-14_0001957845-26-000082_k-pecxamendedandrestated
source: real
tier: 2

assertions:

  - id: kkr_floor_has_no_unit
    family: F08_units
    member: bps_vs_percent
    kind: field_value
    target: libor_floor_pct
    expect: "0%"
    note: >
      '"Floor" means zero (0).'

      Zero per cent is the answer and the document does not say per cent. The
      value happens to be immune to the ambiguity -- zero is zero at any scale
      -- which is exactly why it is worth an assertion: a pipeline that
      recovers 0 here has not demonstrated it would recover 50 basis points
      from the same construction, and Eagle Point shows the construction
      carrying a non-zero number.

  - id: kkr_closing_date_is_an_event_in_another_agreement
    family: F03_external_reference
    member: schedule_omitted_from_filing
    kind: field_status
    target: closing_date
    expect: external_reference
    note: >
      '"Closing Date" means the date of initial funding of Loans under the
      Existing Credit Agreement.'

      external_reference rather than a null value, and the distinction is the
      one the F03 split exists for. Aspen and Constellation Brands define
      their Closing Date as an event under THIS agreement, and the honest
      answer there is that the document does not state it. Here the event took
      place under a different instrument, so the date exists, is knowable, and
      lives in a document that was not filed.

      The practical difference is what a reader should do next. For Aspen
      there is nothing to look up; for this one there is, and saying so is the
      whole value of the status.

  - id: kkr_pec_headings_are_inline_and_mixed_case
    family: F11_layout
    member: grid_rendered_as_text
    kind: text_present
    target: "Section 1.01. Definitions"
    expect: true
    note: >
      The second document the mixed-case heading rule recovers: 13 sections
      before, 112 after, 32,743 characters each down to 3,800. Worth its own
      assertion rather than a mention in Latham's, because the two filings
      share nothing but the style -- different sponsor, different counsel,
      different deal -- and a fix justified on one document is a fix fitted to
      one document. Three filings in the harvest are drafted this way and all
      three were segmenting into article-sized blobs.

  - id: kkr_pec_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.
