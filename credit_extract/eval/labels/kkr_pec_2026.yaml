# Tier 2 assertions: KKR Private Equity Conglomerate LLC, Amended and Restated
# Credit Agreement, September 2026.
#
# Fit side, never read during development. Kept for two definitions.
#
#   "Floor" means zero (0).
#
# A word, then a bare numeral in parentheses, and no percent sign anywhere. The
# corpus now holds nine renderings of a zero floor and this is the only one
# with no unit at all -- "0" could be zero per cent or zero of anything, and
# the field is typed as a percent. Valvoline's bare word "zero" at least
# carries no misleading digit; this one supplies a number a parser can take and
# no unit to scale it by.
#
#   "Closing Date" means the date of initial funding of Loans under the
#   Existing Credit Agreement.
#
# An undated event located in a different agreement. The corpus has eight
# documents whose Closing Date is an event and this is the first where the
# event happened under an instrument that is not this one and is not filed --
# so it is unresolvable twice over.

document: kkr_pec_2026
corpus_name: F_kkr-private-equity-conglomerate-llc_2026-09-14_0001957845-26-000082_k-pecxamendedandrestated
source: real
tier: 2

assertions:

  - id: kkr_floor_has_no_unit
    family: F08_units
    member: bps_vs_percent
    kind: field_value
    target: libor_floor_pct
    expect: "0%"
    note: >
      '"Floor" means zero (0).'

      Zero per cent is the answer and the document does not say per cent. The
      value happens to be immune to the ambiguity -- zero is zero at any scale
      -- which is exactly why it is worth an assertion: a pipeline that
      recovers 0 here has not demonstrated it would recover 50 basis points
      from the same construction, and Eagle Point shows the construction
      carrying a non-zero number.

  - id: kkr_closing_date_is_an_event_in_another_agreement
    family: F03_external_reference
    member: schedule_omitted_from_filing
    kind: field_status
    target: closing_date
    expect: external_reference
    note: >
      '"Closing Date" means the date of initial funding of Loans under the
      Existing Credit Agreement.'

      external_reference rather than a null value, and the distinction is the
      one the F03 split exists for. Aspen and Constellation Brands define
      their Closing Date as an event under THIS agreement, and the honest
      answer there is that the document does not state it. Here the event took
      place under a different instrument, so the date exists, is knowable, and
      lives in a document that was not filed.

      The practical difference is what a reader should do next. For Aspen
      there is nothing to look up; for this one there is, and saying so is the
      whole value of the status.

  - id: kkr_pec_headings_are_inline_and_mixed_case
    family: F11_layout
    member: grid_rendered_as_text
    kind: text_present
    target: "Section 1.01. Definitions"
    expect: true
    note: >
      The second document the mixed-case heading rule recovers: 13 sections
      before, 112 after, 32,743 characters each down to 3,800. Worth its own
      assertion rather than a mention in Latham's, because the two filings
      share nothing but the style -- different sponsor, different counsel,
      different deal -- and a fix justified on one document is a fix fitted to
      one document. Three filings in the harvest are drafted this way and all
      three were segmenting into article-sized blobs.

  - id: kkr_pec_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      "governed by the laws of the State of New York" The corpus is near-
      uniform on this field and that is what makes it worth asserting at
      scale: of the agreements that state a governing law, all but five say
      New York. The five are the meaningful negatives -- Cadeler's LMA
      facility (English law), KNOT Offshore's (Norwegian law), ATII's warrant
      (California) and ProFrac's two stock transfers (Delaware) -- and four of
      the five are documents that are not US credit agreements. A field whose
      answer is the same 90% of the time is exactly where a pipeline looks
      competent by guessing, and where the only evidence that it is reading
      rather than guessing is the handful of documents where the answer
      differs.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: kkr_pec_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_status
    target: guarantor.legal_name
    expect: absent_from_document
    note: >
      'all Obligations (and any other obligations) of Borrowers hereunder and
      under the other Finance Documents shall be joint and several and, as
      such, each Borrower shall be liable for all of such obligations of each
      other Borrower'

      There is no guarantor because the obligors are the Borrowers alone (the
      K-PEC entities listed on Schedule 1.01(B)), jointly and severally
      liable and secured by their own Security Agreement; the agreement has
      no Guarantor term and no guaranty of the Obligations, and neither K-PEC
      nor K-PEC Holdco is a party. The only guaranties it mentions are the
      Permitted Unsecured Guaranties that Borrowers may give for Holding
      Vehicle debt.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: kkr_aggregate_commitments_stated
    family: F06_structure
    member: nav_or_subscription_line
    kind: field_value
    target: revolver.commitment
    expect: "$1,325,000,000"
    note: >
      'The aggregate principal amount of the Commitments of all Lenders as of
      the Amendment and Restatement Date is $1,325,000,000'.

      The amended and restated agreement states the aggregate Commitments as
      one figure inside the definition of Commitment (Schedule 1.01(A), which
      holds the per-lender amounts, is not in the text). The Maximum Commitment
      carries no figure of its own ('means the Commitment as it may be (a)
      reduced from time to time pursuant to Section 2.08 hereof'). Rejected
      the accordion ceiling 'the Maximum Commitment as increased pursuant to
      this Section 2.02 shall not exceed $2,500,000,000 at any one time' and
      the $100,000,000 minimum below which reductions may not go.

  - id: kkr_stated_maturity_date_is_answer
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: revolver.maturity_date
    expect: 2029-09-11
    note: >
      '"Stated Maturity Date" means September 11, 2029'; '"Maturity Date"
      means the earlier of: (a) the Stated Maturity Date; and (b) the date
      upon which the Administrative Agent declares the Obligations due and
      payable'; 'shall be due and payable on the Maturity Date, and the
      Borrowers hereby unconditionally promise to pay'.

      Section 2.06(b) makes the loans due on the Maturity Date, whose only
      dated limb is the Stated Maturity Date (the others are acceleration and
      a Change of Control). Rejected the earlier end of availability: '"Commitment
      Termination Date" means the earliest to occur of (a) the Business Day
      following the date that is one (1) month before the Stated Maturity
      Date'. Extension noted, not applied, since it needs lender consent:
      'The Borrowers may request to extend, at their option, the Stated
      Maturity Date then in effect'.

  - id: kkr_margin_tops_with_cash_sweep_ltv_step
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "3.50%"
    note: >
      '"Margin" means three percent (3.00%) per annum in the case of Term Rate
      Loans or Daily SOFR Loans and two percent (2.00%) per annum in the case
      of Base Rate Loans'; 'the relevant Margin for all Loans shall be
      increased by one-half percent (0.50%) per annum'; '"Cash Sweep LTV"
      means twenty-seven and one-half percent (27.50%)'.

      Computed: 3.00% + 0.50% = 3.50%. The SOFR margin has two levels set by
      LTV: 3.00%, and 3.50% while the latest reported LTV is at or above the
      27.50% Cash Sweep LTV. That step is a coverage level, not a default
      step-up (an LTV above the Cash Sweep LTV triggers sweeps and cure plans,
      and only failing a Required LTV Plan is an Event of Default), so it
      counts. Rejected the 2.00% Base Rate margin and the extra 2.00% that
      applies only while certain Events of Default continue. The definition
      also says "or any greater percent per annum applicable pursuant to
      Section 2.02", but Section 2.02 (the accordion) sets no margin, so the
      text fixes no higher rate.

  - id: kkr_unused_rate_steps_with_usage
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.65%"
    note: >
      '"Unused Rate" means the following percentages per annum based upon the
      Daily Usage as set forth below: Daily Usage Unused Rate ≤50% 0.65% >50%
      0.45%'; 'an unused fee calculated daily equal to the Unused Rate
      multiplied by the amount by which the aggregate Commitments during such
      period exceed'.

      Section 2.05(b) charges the unused fee at the Unused Rate, which steps
      with Daily Usage: 0.65% at or below 50% usage and 0.45% above it. The
      highest rate is 0.65%. No other undrawn or minimum-use fee appears.
