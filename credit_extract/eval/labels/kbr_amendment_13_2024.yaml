# Tier 2 assertions: KBR, Inc., Amendment No. 13 to Credit Agreement, filed
# August 19, 2024 (Exhibit 10.1).
#
# HELD OUT. Read once, to write this label, and no code was changed on its
# strength.
#
# The pair of kbr_amendment_14_2026, which is on the fit side. Same borrower,
# same agreement, consecutive amendment numbers, two years apart, one on each
# side of the split -- the only such pair in the corpus, and it arrived there
# by the hash rule rather than by choice.
#
# The grid is the one already described in the Hornbeck label, seen a version
# earlier:
#
#   Pricing Level | Consolidated Net Leverage Ratio | Term SOFR | Base | ...
#   1 | > 4.25:1.00                  | 2.25% | 1.25% | 1.35% | 0.325%
#   2 | < 4.25:1.00, but > 3.25:1.00 | 2.00% | 1.00% | 1.20% | 0.300%
#   3 | < 3.25:1.00, but > 2.25:1.00 | 1.75% | 0.75% | 1.05% | 0.275%
#   4 | < 2.25:1.00, but > 1.25:1.00 | 1.50% | 0.50% | 0.90% | 0.250%
#   5 | < 1.25:1.00                  | 1.25% | 0.25% | 0.75% | 0.225%
#
# Level 1 is the worst and Level 5 the best, the reverse of Hornbeck's. Six
# columns, five rows, and a stray "5" rendered between rows 2 and 3 -- a page
# number that the flattening pulled into the table body, sitting in a run of
# empty cells. The number 5 is also a valid Pricing Level in this grid.

document: kbr_amendment_13_2024
corpus_name: L_kbr-inc-kbr_2024-08-19_0001357615-24-000048_exhibit10-108142024
source: real
tier: 2

assertions:

  - id: kbr_13_grid_top_level_is_the_worst_level
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "2.25%"
    note: >
      Pricing Level 1, at leverage above 4.25:1.00, pays 2.25% over Term
      SOFR -- the most expensive row and the one numbered first. Hornbeck
      numbers its five levels in the opposite direction, so "Level 1" means
      the cheapest money there and the dearest here.

      Amendment No. 14 carries the same grid two years later, on the fit side.
      The two amendments are therefore a check on the split as much as on the
      extractor: the same table, the same convention, scored independently on
      both sides.

  - id: kbr_13_page_number_is_not_a_pricing_level
    family: F11_layout
    member: table_split_across_pages
    kind: field_value
    target: closing_date
    expect: 2018-11-12
    note: >
      '"Closing Date" means November 12, 2018.'

      Asserted as the control for the layout defect rather than as a claim
      about dates. The grid in this document has a page number -- the digit 5
      -- flattened into the table body between rows 2 and 3, surrounded by
      empty cells, in a grid whose rows are numbered 1 to 5. A row-reading
      pass that keys on the leading integer has six candidate rows and two of
      them claim to be Level 5.

      The Closing Date is the thing in this document that is simple, stated
      and unaffected by the layout, which makes it the right tripwire: if the
      flattening ever damages enough to move this value, the damage is not
      confined to the grid.

  - id: kbr_13_has_four_maturity_dates
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: initial_term_loan.maturity_date
    expect: 2031-01-19
    note: >
      '"Maturity Date" means (a) with respect to the Revolving Credit
      Facility, February 7, 2029, (b) with respect to each Term A Facility
      other than the Term A-2 Facility, February 7, 2029, (c) with respect to
      the Term B Facility, January 19, 2031 and (d) with respect to the Term
      A-2 Facility, August 1[, ...]'

      Four tranches, four dates, one defined term, and two of the four share a
      date -- so a count of distinct dates gives three and a count of branches
      gives four. The Term B Facility is the term loan the field means, and
      January 19, 2031 is the latest of the four, which makes it both the
      right answer and the answer a "take the furthest maturity" rule would
      reach for the wrong reason.

      Sysco's is the shape one step harder: two of its three tranches are
      stated as durations from a date the exhibit never fixes. KBR states all
      four outright.
