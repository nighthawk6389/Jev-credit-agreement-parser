# Tier 2 assertions: Ares Capital CP Funding, Amendment No. 18, 28 July 2025.
#
# A blackline. It describes none of its changes in prose. Article III says, in
# one sentence, that the agreement is amended "to delete the stricken text and
# to add the bold and double-underlined text as set forth on the pages attached
# as Appendix A", and Appendix A is a conformed copy of the whole agreement
# with the changes marked typographically.
#
# This document is the reason the ingester stopped writing struck text into the
# offset space. Flattened to plain text, its facility size reads
#
#     Up to U.S. $ 2,150,000,000 2,250,000,000
#
# and the same pair appears again inside the definition. A first-match parser
# reports $2,150,000,000 -- the figure this amendment deleted -- with full
# confidence, off a span that quotes the document accurately. Nothing about the
# output looks wrong. That is the worst error this pipeline can make, and it is
# not hypothetical: it is a $100,000,000 error on the headline term of a real
# facility, and it took a real document to find it.

document: ares_cp_funding_amendment_2025
source: real
tier: 2

assertions:
  # -- F11 layout: structure destroyed by rendering ------------------------
  - id: ares_deleted_figure_is_not_addressable
    family: F11_layout
    member: blackline_flattened_to_text
    kind: text_present
    target: "2,150,000,000"
    expect: false
    note: >
      The superseded facility size. It is kept in the sidecar for audit and
      excluded from the text, so no span can quote it as a term.

  - id: ares_operative_figure_survives
    family: F11_layout
    member: blackline_flattened_to_text
    kind: text_present
    target: "2,250,000,000"
    expect: true
    note: the figure this amendment inserted, and the one now in force

  # -- F05 versioning ------------------------------------------------------
  - id: ares_blackline_is_recognised
    family: F05_versioning
    member: amendment_restates_section
    kind: chain_finding
    target: blackline_restates_agreement
    expect: true
    note: >
      An amendment mechanism carried entirely by typography. Reporting no
      effects, as the parser did before, is indistinguishable from an
      amendment that changes nothing.

  - id: ares_markup_survived_conversion
    family: F05_versioning
    member: conformed_vs_executed
    kind: chain_finding
    target: blackline_markup_lost
    expect: false
    note: >
      The counterpart finding. Were the strike-through to be lost in
      conversion, no term in this document could be relied on and the report
      must say exactly that rather than read the flattened text.

  - id: ares_conformed_copy_is_self_sufficient
    family: F05_versioning
    member: operative_version_ambiguous
    kind: chain_finding
    target: base_agreement_absent
    expect: false
    note: >
      Unlike a prose amendment filed alone, a blackline attaches the whole
      agreement; once the deletions are excised the operative terms are all
      present in the one document.

  # -- coverage ------------------------------------------------------------
  - id: ares_uncaptured_content_is_swept
    family: F11_layout
    member: table_split_across_pages
    kind: report_count
    target: orphan_chunks
    compare: at_most
    expect: 30
    note: >
      A tripwire on the sweep, not a target -- and now a CEILING, so it can
      say so. Observed 28. Fewer uncaptured chunks is always fine; more is
      the thing to investigate, and 30 is where that starts.

  # -- guarantors: who guarantees the obligations, and where the text says so --

  - id: ares_guarantor
    family: F01_integrity
    member: undefined_term_used
    kind: field_status
    target: guarantor.legal_name
    expect: absent_from_document
    note: >
      '" Transaction Documents " means this Agreement, any Hedging Agreement,
      any Joinder Supplement, the Purchase and Sale Agreements, the
      Participation Agreement, the Collection Account Agreement, the Unfunded
      Exposure Account Agreement, the Trustee and Collateral Custodian Fee
      Letter, any Lender Fee Letter, the Pledge Agreement and each document,
      instrument or agreement related to any of the foregoing'

      '" Pledge " means the pledge of any Eligible Loan Asset or other
      Portfolio Asset pursuant to Article II'

      'Ares Capital CP Funding II, as the guarantor (the " Guarantor ")'

      There is no guarantor because ARES CAPITAL CP FUNDING LLC is a
      special-purpose borrower whose credit support is the pledge of its Loan
      Assets (plus the equity pledge by the Equityholder under the Pledge
      Agreement): the six parties to the restated agreement (Borrower,
      Servicer/Transferor, Agent, Lenders, Trustee, Bank/Collateral Custodian)
      include no guarantor, its Transaction Documents include no guaranty, and
      no guarantor signs Amendment No. 18. The only "Guarantor" in the text
      belonged to the 2004 Original Agreement, which the 2010 Restatement
      Agreement, without that guarantor as a party, amended and restated.

  # -- economic terms: labelled twice, independently, from the text,
  # -- before the readers for them were written --

  - id: ares_maximum_facility_amount_is_ceiling_only
    family: F06_structure
    member: nav_or_subscription_line
    kind: field_value
    target: revolver.commitment
    expect: null
    note: >
      '" Maximum Facility Amount " means the aggregate Commitments of the
      Lenders then in effect, which amount may be up to $ 2,250,000,000'; 'the
      dollar amount set forth opposite such Lender'.

      Must not report $2,250,000,000 (also on the conformed cover as 'Up to
      U.S. $ 2,250,000,000'): the text gives it only as an up-to ceiling and
      defines the size as the aggregate Commitments then in effect, which are
      the per-lender amounts on Annex A. Annex A is not in this text (the
      filing reproduces only the amended pages, ending in Section 11.14, with
      no Appendix B schedules), and the amendment itself gives the new lender
      'a several, but not joint, Commitment in the amount set forth on Annex A
      to the Loan and Servicing Agreement' with no figure. The $200,000,000
      Swingline Commitment is a sublimit, not the facility size.

  - id: ares_stated_maturity_five_years_after_eighteenth_amendment
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: revolver.maturity_date
    expect: 2030-07-28
    note: >
      '" Facility Maturity Date " means the earliest to occur of (i) the Stated
      Maturity Date'; '" Stated Maturity Date " means, the five year
      anniversary following the Eighteenth Amendment Effective Date';
      '"Eighteenth Amendment Effective Date" means July 28, 2025'.

      Computed: July 28, 2025 plus five years is July 28, 2030. The other
      Facility Maturity Date limbs are undated events (declaration under
      Section 7.01, the Collection Date, termination under Section 2.18(b)).
      July 28, 2030 is a Sunday, but neither maturity definition carries a
      business-day roll (only the Reinvestment Period definition does), and
      no general roll is in these pages, so it is not moved. Rejected the
      earlier end of the Reinvestment Period ('the three year anniversary of
      the Eighteenth Amendment Effective Date', July 28, 2028). The option to
      agree a later date under Section 2.19 is conditional and not applied.

  - id: ares_applicable_spread_as_amended
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "1.80%"
    note: >
      '" Applicable Spread " means, (i) prior to the Eighteenth Amendment
      Effective Date, 2.00% per annum and (ii) thereafter, 1.80 % per annum';
      'an interest rate per annum equal to the applicable Benchmark for such
      date (not less than zero) plus the Applicable Spread'.

      Labelled as amended: the Eighteenth Amendment Effective Date is July 28,
      2025, the date this amendment took effect, so the 2.00% level covers
      only periods before it. That is the superseded pre-amendment rate, not a
      level the schedule can still produce. From then on the spread over the
      Benchmark is a flat 1.80%, and the same spread applies over the Base
      Rate during a Disruption Event. Rejected the default and post-maturity
      increase 'at any time during the existence of an Event of Default or
      after the occurrence of the Facility Maturity Date, the Applicable
      Spread shall be increased by 2.00% per annum'.

  - id: ares_floor_defined_as_zero
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.00%"
    note: >
      '" Floor " means for purposes of this Agreement, 0%'; 'an interest rate
      per annum equal to the applicable Benchmark for such date (not less than
      zero) plus the Applicable Spread'.

      The facility floor is 0%, and the Yield Rate applies it to the Benchmark
      itself, before the spread is added, not to the all-in rate. Rejected the
      next definition, Floor Obligation, which concerns floors on the
      underlying portfolio loans ('calculated as the greater of (i) a
      specified'), not this facility.
