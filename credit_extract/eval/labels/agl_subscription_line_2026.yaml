# Tier 2 assertions: AGL Private Credit Income Fund, credit agreement dated
# October 18, 2024 (Exhibit 10.1), filed September 9, 2026.
#
# HELD OUT. Read once, to write this label, and no code was changed on its
# strength. This one matters more than the rest of the batch for that reason,
# because of what it is.
#
# It is a subscription line -- a capital call facility secured on the Funds'
# uncalled capital commitments:
#
#   "Capital Contribution" means the amount of cash actually contributed by an
#   Investor to the applicable Fund with respect to its Uncalled Capital
#   Commitment in response to any Drawdown Notice ... in accordance with the
#   applicable Fund's applicable Governing Agreement and/or Subscription
#   Agreement[s]
#
# "Uncalled capital" occurs 31 times. That is the exact shape the blind-spot
# register names as untested and says nothing in the corpus has read:
#
#   What remains is the subscription line proper. Both labelled documents lend
#   against acquired assets. A facility secured on uncalled capital
#   commitments -- where the credit is the limited partners' rather than the
#   portfolio's -- is still a shape nothing here has read.
#
# The harvest contained one all along. It is on the held-out side, so it can
# close the gap only as a test and never as material to build against, and
# that is worth stating plainly rather than treating as an inconvenience: the
# blind spot the register describes remains open for construction and is now
# closed for measurement.
#
# The classifier returns unknown at 0.00, and the reason is arithmetic:
#
#   "uncalled capital"     decisive of nav_or_subscription, first at 41,542
#   detection window       30,000
#   "borrowing base"       decisive of abl_revolver, inside the window
#   "s&p and moody"        decisive of investment_grade, inside the window
#
# Its own decisive vocabulary is 11,542 characters past where the classifier
# stops reading, and the two families that do fire are both wrong and cancel
# each other. Right answer, and nothing about the mechanism is right.

