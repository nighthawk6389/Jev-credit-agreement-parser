assertions:

  - id: agl_is_a_subscription_line
    family: F06_structure
    member: nav_or_subscription_line
    kind: archetype
    expect: nav_or_subscription
    note: >
      Expected to fail today, and recorded rather than repaired.

      This is the assertion the blind-spot register's F06_nav_or_subscription_
      line entry has been waiting for. Both previously labelled fund
      facilities -- Star Mountain's BDC warehouse and StepStone's SPV -- lend
      against acquired assets, and the register says so explicitly. This one
      lends against the limited partners' promises, which is a different
      credit, and the profile that exists for it has never been exercised on a
      real document.

      What it takes to pass is not new vocabulary. "Uncalled capital" is
      already decisive of nav_or_subscription and is already in this document
      31 times; it is simply not in the first 30,000 characters. The
      Accelevation pair on the fit side makes the same point without needing
      this document: a classification that depends on where a phrase sits is
      a classification of the document's front matter.

  - id: agl_floor_is_zero
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.00%"
    note: >
      '"Floor" means 0.00%.' Six words, no benchmark, no conditions -- the
      shortest Floor definition in the corpus, in the document with the most
      unusual structure. The two facts are unrelated and that is the useful
      part: the difficulty of a deal and the difficulty of its definitions do
      not travel together, and a pipeline that routes by deal complexity will
      route this one wrong in both directions at once.

  - id: agl_closing_date_is_stated
    family: F05_versioning
    member: conformed_vs_executed
    kind: field_value
    target: closing_date
    expect: 2024-10-18
    note: >
      October 18, 2024, on the cover page, two years before the filing.

      The cover is also where this document's layout problem lives. A Word
      field code -- DOCPROPERTY "DocID" \* MERGEFORMAT USActive 64201697.6 --
      sits immediately beneath the date, and it recurs 181 times through the
      text as a page footer, so a document identifier and a revision number
      appear between paragraphs on every page of a 586,411-character
      agreement.

      That makes this the cleanest test of whether page furniture displaces a
      real value: the field code is adjacent to the answer, numeric, and
      repeated more often than any actual term in the document.
