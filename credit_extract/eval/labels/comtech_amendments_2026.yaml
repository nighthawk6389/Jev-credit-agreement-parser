# Tier 2 assertions: Comtech Telecommunications Corp., Amendment No. 5 to
# Credit Agreement (Exhibit 10.1), August 2026.
#
# Fit side, never read during development. Short, because the document is
# short: 28,594 characters, eight sections, and almost entirely operative
# amendments to provisions that live in a base agreement the harvest does not
# contain.
#
# It is labelled for the pair it forms with Exhibit 10.2 in the same
# accession, Amendment No. 4 to the SUBORDINATED Credit Agreement. Comtech
# filed both on the same day: a senior facility and a subordinated one,
# amended in lockstep, each amending a base agreement that is not in the
# harvest.
#
# That is a structure the corpus has not had. Its amendment chains so far are
# successive amendments to ONE agreement -- Wheels Up, BRC, Ares. This is one
# borrower with two capital structures amended together, where a term appearing
# in both exhibits may mean different things and the subordination between them
# is set in an intercreditor agreement that was not filed either.

document: comtech_amendment_5_2026
corpus_name: L_comtech-telecommunications-corp-de-cmtl_2026-08-03_0000023197-26-000084_ex101comtech-amendmentno5t
source: real
