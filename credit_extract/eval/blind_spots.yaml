# Blind-spot register.
#
# Printed in full in every report the pipeline emits. These are precisely the
# inputs where the pipeline is most likely to be wrong, because they are where
# the information is least available. Claiming coverage you do not have is the
# failure mode this register exists to prevent.
#
# Two categories, and they are not the same thing:
#
#   untestable_from_public_filings
#       a permanent property of the source. No amount of harvesting fixes it.
#
#   untestable_in_this_environment
#       a property of where the build ran. Fixable by running somewhere with
#       the relevant egress or credentials, and the register says exactly what
#       would fix each one.
#
# A family appearing here is not a bug to be closed. It is a statement about
# what the numbers elsewhere in the report do and do not cover.

version: 2

untestable_from_public_filings:
  - id: F03_fee_letter
    family: F03_external_reference
    member: fee_letter
    status: partially_lifted
    reason: >
      Fee letters themselves are essentially never filed. The agreements that
      point at one are: 52 of the 100 in corpus/edgar name a Fee Letter and 44
      use "separately agreed" or equivalent.
    consequence: >
      The *detection* side is now testable -- there are 52 real examples of
      the reference to find, and marking one external_by_design is checkable.
      What stays untestable is the content: no filing anywhere states the
      number, so a pipeline claiming to have resolved one is wrong by
      construction and nothing in the corpus can catch that.

  - id: F03_sponsor_model
    family: F03_external_reference
    member: sponsor_model
    reason: financial models are not loan documents and are not filed
    consequence: >
      Tested only against the synthetic fixture, where the clause was written
      to be found. Real sponsor-model carve-outs are drafted many ways.

  - id: F03_disclosure_letter
    family: F03_external_reference
    member: disclosure_letter
    reason: routinely omitted under the exhibit-omission rules
    consequence: >
      Indistinguishable in a filing from a schedule omitted by the filer,
      which is the exact distinction section 7 of the spec turns on.

  - id: F06_unitranche_with_aal
    family: F06_structure
    member: unitranche_with_aal
    status: partially_lifted
    reason: >
      Agreements Among Lenders are between lenders and are not borrower
      exhibits, so none is in the corpus. Nine of the hundred agreements refer
      to one, or to first-out and last-out tranches.
    consequence: >
      The nine references make it testable that a unitranche is *recognised*.
      The economics remain invisible: the split between first-out and last-out
      lives in the AAL, so the deal still reads as a single tranche at the
      blended rate and nothing in any filing says otherwise.

  - id: F06_nav_or_subscription_line
    family: F06_structure
    member: nav_or_subscription_line
    status: partially_lifted
    reason: >
      Fund-level facilities are filed rarely, but not never: stratum H of
      corpus/edgar holds six subscription, NAV and CLO warehouse facilities,
      and eight agreements overall use capital-commitment or NAV vocabulary.
    consequence: >
      Archetype dispatch now has examples, and they are unlabelled. A NAV line
      misread as a cash-flow term loan would be covenanted on EBITDA it does
      not have, which is the failure this entry exists for -- the six
      documents make it visible rather than fixing it.

  - id: F09_term_defined_in_other_loan_document
    family: F09_definitional_depth
    member: term_defined_in_other_loan_document
    reason: >
      security, guarantee and intercreditor agreements are frequently filed
      separately from the credit agreement or not at all
    consequence: >
      A term defined only in the security agreement resolves to nothing, and
      the definition graph reports it as undefined rather than as external.

untestable_in_this_environment:
  - id: EDGAR_egress
    families: [F01_integrity, F02_precedence, F03_external_reference,
               F04_absence, F05_versioning, F06_structure, F07_benchmark,
               F08_units, F09_definitional_depth, F10_conditionality,
               F11_layout]
    status: partially_lifted
    reason: >
      sec.gov and efts.sec.gov are blocked by this build environment's egress
      policy, so the harvest could not be run here. It was run elsewhere and
      supplied: corpus/edgar holds 100 agreements stratified across 18 strata
      with every target met, plus four filings in corpus/real. What is still
      missing is labels. 104 documents are a corpus; without ground truth they
      measure whether the pipeline *runs*, not whether it is right.
    consequence: >
      Most accuracy numbers in this report still come from documents written
      by the same hand that wrote the parser. F05 is now the exception: two
      real amendment chains are labelled, and one of them -- Wheels Up
      Amendments No. 4 and No. 5 -- is the family's defining case, where
      reading the 547,000-character conformed agreement alone reports the
      revolver as expiring two years early. The real documents have shown
      repeatedly what synthetic labels are worth: recall collapsed from roughly thirty
      fields of thirty-eight to between zero and three; both amendments parsed
      to no effects at all; a blackline mechanism the pipeline had no concept
      of was reporting a deleted figure as the facility size, and it turns out
      to be how a third of the corpus amends anything; and the credit spread
      adjustment check was firing on 40 agreements that correctly have none.
      The per-family table separates real from synthetic for this reason. Read
      the real column; the synthetic column measures the fixtures.
    remedy: >
      Label the strata in corpus/edgar, Tier 2 at least, starting with the
      families the table reports as undersampled. The harness reads a labels
      file alongside any document, so each one drops straight in.

  - id: JEV_API
    families: [F02_precedence, F03_external_reference, F04_absence,
               F06_structure]
    reason: JEV_API_KEY is not configured, so OfflineJev serves every request.
    consequence: >
      OfflineJev is a deterministic lexical stand-in, not a calibrated model.
      Validators B, C, D, E and G are exercised end to end but their
      judgements are keyword matches. Archetype dispatch is the clearest
      casualty and it is now measured: across the 62 corpus documents whose
      stratum implies an archetype, the deterministic classifier gets 17
      right and 14 confidently wrong, and four alternative configurations
      trade those two against each other at roughly one for one without
      improving either. The distinguishing vocabulary sits deep in a document
      and the shared vocabulary sits on the cover, so no anchoring rule
      separates them. A wrong archetype is worse than none, because it marks
      applicable fields not_applicable_to_archetype and suppresses real terms
      silently. See docs/corpus_findings.md for the table.
    remedy: >
      set JEV_API_KEY and refit thresholds; they are tagged per backend. This
      one will not yield to more keywords -- the measurement above is the
      argument for not trying.

  - id: ANTHROPIC_API
    families: [F01_integrity, F09_definitional_depth, F11_layout]
    reason: ANTHROPIC_API_KEY is not configured.
    consequence: >
      Extraction runs on anchored patterns rather than an LLM pass. Recall is
      lower than production would be, and the orphan sweep is carrying more
      weight than it would with a real extractor behind it.
    remedy: set ANTHROPIC_API_KEY and run with --backend anthropic.

  - id: FPML_SCHEMAS
    families: [F06_structure, F07_benchmark]
    status: partially_lifted
    reason: >
      fpml.org serves the schemas behind an authenticated session, so the
      bytes come from a pinned commit of a public mirror
      (rosetta-models/rune-fpml) rather than from ISDA. Three schemas are
      recorded with their SHA-256, and `gen_fpml.py --drift` reproduces the
      checked-in index from them byte for byte.
    consequence: >
      What was lifted is the hand-mapping: the 40 element names this
      repository binds to are no longer invented, all 40 are declared in the
      pinned schemas, and fpml() raises on a name that is not. Two things
      stay unverified, and they are not small. The pin makes the bytes
      reproducible, not authentic -- nothing here checks them against ISDA,
      so a mirror that diverged before the pinned commit would be indexed
      without complaint. And the check is a check of names: it says
      spreadAdjustment is declared, not that it means the credit spread
      adjustment a SOFR facility quotes, nor that it is legal where the
      mapping puts it. FpML declares the same name in more than one scope --
      delayedDraw is both a boolean on a term loan and a facility element --
      and the index merges them, so a name resolving proves less than it
      looks like it proves. The documentation each mapped element carries is
      in the index and was read once, by hand; nothing re-reads it.
    remedy: >
      Fetch the schemas from fpml.org with a session and compare the hashes,
      which settles authenticity. Position and meaning need the generated
      bindings -- `gen_fpml.py --generate` runs xsdata over the loan schema --
      so that a mapping to an element that cannot appear there fails to
      compile rather than passing a name check.
