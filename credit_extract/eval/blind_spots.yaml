# Blind-spot register.
#
# Printed in full in every report the pipeline emits. These are precisely the
# inputs where the pipeline is most likely to be wrong, because they are where
# the information is least available. Claiming coverage you do not have is the
# failure mode this register exists to prevent.
#
# Two categories, and they are not the same thing:
#
#   untestable_from_public_filings
#       a permanent property of the source. No amount of harvesting fixes it.
#
#   untestable_in_this_environment
#       a property of where the build ran. Fixable by running somewhere with
#       the relevant egress or credentials, and the register says exactly what
#       would fix each one.
#
# A family appearing here is not a bug to be closed. It is a statement about
# what the numbers elsewhere in the report do and do not cover.

version: 2

untestable_from_public_filings:
  - id: F03_fee_letter
    family: F03_external_reference
    member: fee_letter
    status: partially_lifted
    reason: >
      Fee letters themselves are essentially never filed. The agreements that
      point at one are: 52 of the 100 in corpus/edgar name a Fee Letter and 44
      use "separately agreed" or equivalent.
    consequence: >
      The *detection* side is now testable and has been tested. Martin
      Marietta's Eighteenth Amendment is labelled, and writing that label
      found that Validator E could not fire on this case at all: it reads the
      sentence a figure sits in, so it only ran on fields that already
      carried a span, and a fee fixed by a fee letter has no figure. A fee
      field with no value is now external by design where the agreement both
      defines a Fee Letter and says the fees are payable under it -- 3
      documents of the 52 that name one and the 23 that define one, which is
      deliberate: external_reference is a settled status and a wrong one is a
      silent error, so the rule buys precision with recall and the other 49
      stay in review rather than being guessed at.

      Star Mountain's BDC warehouse is the second labelled case and it shows
      what that recall cost looks like: it defines "Fee Letters" in the
      plural, so the singular pattern never matched, while the rate itself
      reads '"Non-Utilization Fee Rate" ... means the "Non-Utilization Fee
      Rate" as set forth in such Lender's Fee Letter.' A fee rate whose own
      definition points at the letter names the fee and the document in one
      sentence and needs no corroboration, so it is now sufficient on its
      own. That route fires on 1 of the 100 harvested documents, which is the
      basis on which a rule bought narrow for precision may be widened at all.

      What stays untestable is the content: no filing anywhere states the
      number, so a pipeline claiming to have resolved one is wrong by
      construction and nothing in the corpus can catch that.

  - id: F03_sponsor_model
    family: F03_external_reference
    member: sponsor_model
    reason: financial models are not loan documents and are not filed
    consequence: >
      Tested only against the synthetic fixture, where the clause was written
      to be found. Real sponsor-model carve-outs are drafted many ways.

  - id: F03_disclosure_letter
    family: F03_external_reference
    member: disclosure_letter
    reason: routinely omitted under the exhibit-omission rules
    consequence: >
      Indistinguishable in a filing from a schedule omitted by the filer,
      which is the exact distinction section 7 of the spec turns on.

  - id: F06_unitranche_with_aal
    family: F06_structure
    member: unitranche_with_aal
    status: partially_lifted
    reason: >
      Agreements Among Lenders are between lenders and are not borrower
      exhibits, so none is in the corpus. Nine of the hundred agreements refer
      to one, or to first-out and last-out tranches.
    consequence: >
      The nine references make it testable that a unitranche is *recognised*.
      The economics remain invisible: the split between first-out and last-out
      lives in the AAL, so the deal still reads as a single tranche at the
      blended rate and nothing in any filing says otherwise.

  - id: F06_nav_or_subscription_line
    family: F06_structure
    member: nav_or_subscription_line
    status: partially_lifted
    reason: >
      Fund-level facilities are filed rarely, but not never: stratum H of
      corpus/edgar holds six subscription, NAV and CLO warehouse facilities,
      and eight agreements overall use capital-commitment or NAV vocabulary.
    consequence: >
      One of the six is now labelled -- Star Mountain's Sixth Amendment, a BDC
      borrowing against its own portfolio of loan assets -- and the failure
      this entry was written for turns out to be sharper than the entry
      guessed. It is not that a fund-level facility has no EBITDA to be
      covenanted on. EBITDA is all over the document: it is the Obligors',
      the portfolio companies', and it sets advance rates. '"Advance Rate"
      means, (i) with respect to First Lien Loan Assets for which the
      applicable Obligor has EBITDA of: (1) greater than $20,000,000, 70.0%'.
      So a pipeline trained on corporate credit agreements finds a covenant
      threshold and a receivables advance rate exactly where it expects them,
      and both belong to somebody else's balance sheet. Eight assertions pin
      it; the deterministic tier passes 6 and the checked-in reading 8. What
      is still untested is the other five documents and the subscription-line
      shape specifically -- this one is a warehouse, which is the same family
      and not the same deal.

      A second is now labelled and it is the one that can be built against:
      StepStone SPV Facility VII, on the fit side and never read during
      development, where Star Mountain is holdout and so can only ever be a
      test. It is a different shape again -- a bankruptcy-remote SPV acquiring
      Collateral Obligations, not a BDC lending off its own balance sheet --
      and it repeats the finding above in a form that removes the last excuse
      for it. Seven EBITDA mentions, every one attached to "the obligor of
      such obligation": eligibility floors of $7,500,000 and concentration
      limits at $15,000,000 and $25,000,000, quoted as percentages of the
      Collateral Portfolio Calculation Base. Those percentages sit exactly
      where a covenant level is expected and none of them is one.

      It also carries the first real instance of something this register
      assumed would be rare: the facility's central economic term is not in
      the filing. '"Advance Rate" has the meaning set forth in Schedule B',
      and no schedule is reproduced -- not one SCHEDULE heading in 653,111
      characters. The detection side is testable and now tested; the value
      never will be, because no filing states it.

      The subscription line proper was the last gap and the harvest turned
      out to contain one all along: AGL Private Credit Income Fund, whose
      "Capital Contribution" is the cash an Investor contributes "with respect
      to its Uncalled Capital Commitment in response to any Drawdown Notice".
      Uncalled capital, 31 times, secured on the limited partners' promises
      rather than on any acquired asset -- the shape this entry said nothing
      here had read.

      It is on the held-out side, so the gap closes for measurement and stays
      open for construction: the document can be a test and can never be
      material to build against. Read once, to write its label, and no code
      was changed on its strength.

      What it shows is that the profile is not the problem. "Uncalled capital"
      is already decisive of nav_or_subscription and is already in this
      document; it first appears at character 41,542, and decisive vocabulary
      is searched in the first 30,000. The classifier returns unknown, saved
      from a wrong answer only by two false positives cancelling -- abl_
      revolver on a borrowing base and investment_grade on "s&p and moody",
      one signal each, tied. The fit-side evidence for the same defect is the
      Accelevation pair, where one conformed amendment and the agreement it
      conforms classified differently because a preamble moved a phrase across
      the window boundary.

      Two more fund facilities were labelled in the same pass and both are
      warehouses rather than subscription lines -- Blue Owl's Core Income
      Funding VII and Athena Funding III, the latter with 777 references to
      collateral obligations. Both classify as abl_revolver at 0.85, which
      rules nav_tests inapplicable: the archetype chosen on the strength of
      the borrowing base suppresses the tests the borrowing base is measured
      by. Both are held out, both recorded, neither repaired.

  - id: F09_term_defined_in_other_loan_document
    family: F09_definitional_depth
    member: term_defined_in_other_loan_document
    reason: >
      security, guarantee and intercreditor agreements are frequently filed
      separately from the credit agreement or not at all
    consequence: >
      A term defined only in the security agreement resolves to nothing, and
      the definition graph reports it as undefined rather than as external.

untestable_in_this_environment:
  - id: EDGAR_egress
    families: [F01_integrity, F02_precedence, F03_external_reference,
               F04_absence, F05_versioning, F06_structure, F07_benchmark,
               F08_units, F09_definitional_depth, F10_conditionality,
               F11_layout]
    status: partially_lifted
    reason: >
      sec.gov and efts.sec.gov are blocked by this build environment's egress
      policy, so the harvest could not be run here. It was run elsewhere and
      supplied: corpus/edgar holds 100 agreements stratified across 18 strata
      with every target met, plus four filings in corpus/real. What is still
      missing is labels. 104 documents are a corpus; without ground truth they
      measure whether the pipeline *runs*, not whether it is right.
    consequence: >
      Most accuracy numbers in this report still come from documents written
      by the same hand that wrote the parser. F05 is now the exception: two
      real amendment chains are labelled, and one of them -- Wheels Up
      Amendments No. 4 and No. 5 -- is the family's defining case, where
      reading the 547,000-character conformed agreement alone reports the
      revolver as expiring two years early. The real documents have shown
      repeatedly what synthetic labels are worth: recall collapsed from roughly thirty
      fields of thirty-eight to between zero and three; both amendments parsed
      to no effects at all; a blackline mechanism the pipeline had no concept
      of was reporting a deleted figure as the facility size, and it turns out
      to be how a third of the corpus amends anything; and the credit spread
      adjustment check was firing on 40 agreements that correctly have none.
      The per-family table separates real from synthetic for this reason. Read
      the real column; the synthetic column measures the fixtures.
    remedy: >
      Label the strata in corpus/edgar, Tier 2 at least, starting with the
      families the table reports as undersampled. The harness reads a labels
      file alongside any document, so each one drops straight in.

  - id: JEV_API
    families: [F02_precedence, F03_external_reference, F04_absence,
               F06_structure]
    reason: JEV_API_KEY is not configured, so OfflineJev serves every request.
    consequence: >
      OfflineJev is a deterministic lexical stand-in, not a calibrated model.
      Validators B, C, D, E and G are exercised end to end but their
      judgements are keyword matches. Archetype dispatch is the clearest
      casualty and it is now measured: across the 62 corpus documents whose
      stratum implies an archetype, the deterministic classifier gets 17
      right and 14 confidently wrong, and four alternative configurations
      trade those two against each other at roughly one for one without
      improving either. The distinguishing vocabulary sits deep in a document
      and the shared vocabulary sits on the cover, so no anchoring rule
      separates them. A wrong archetype is worse than none, because it marks
      applicable fields not_applicable_to_archetype and suppresses real terms
      silently. See docs/corpus_findings.md for the table.

      What stands between a wrong archetype and a wrong answer is the evidence
      veto, and it has now failed in both directions on fit-side documents.
      Air T showed it firing too little: a real Consolidated Term Loan reported
      as a term the deal kind cannot have. Golub's BDC warehouse showed it
      firing too much, which costs coverage rather than correctness but costs
      it in bulk -- a fund facility describes the loans it may buy in the
      vocabulary of the loans a company owes, so all four inapplicable groups
      were vetoed by their own collateral and nothing was suppressed at all.
      "Delayed draw" appears nineteen times there and every one is inside
      "Delayed Drawdown Collateral Loan". A phrase now only vetoes where some
      use of it sits outside a collateral description.

      The register assumed the damage was bounded by the veto. It was not.
      Greenfire Resources' Business Acquisition Report is in the harvest -- a
      Canadian disclosure with financial statements, no defined terms, no
      borrower and no operative clause -- and the classifier read a $50
      million revolver out of a footnote and returned second_lien at 0.70.
      Above 0.50 the profile begins marking fields not_applicable_to_archetype,
      which is confident, so a document with nothing to classify was about to
      settle fields on the strength of a guess. The corpus caught it as the
      first silent error the gate has ever reported. Detection now requires
      the document to contain an Event of Default: zero occurrences in the
      report, three at the lowest in any real agreement here and mostly above
      fifteen, so the margin is wide and the test is about document kind
      rather than quality.

      Health Catalyst showed the third way it fails, which is neither: the
      phrase list can simply miss the term. The agreement writes "Consolidated
      Adjusted EBITDA" 53 times and "Consolidated EBITDA" never, so the veto
      caught it only through "leverage ratio" -- the right outcome by an
      unrelated route. Two labels had been written asserting the opposite, on
      that same string search, and satisfying them would have taught the
      pipeline to suppress a capped add-back ladder under a confident status.
      The lesson is about labels as much as code: a string search is evidence
      about strings, and a label that reasons from one inherits its blind spot.

      Labelling the remaining 32 documents found a fourth way, and it is the
      one the Event of Default floor cannot reach. The test asks whether a
      filing is an agreement. It does not ask whether it is a *credit*
      agreement, and the difference is where the confident wrong answers now
      live:

        Neovolta's Registration Rights Agreement would classify as
        venture_debt at 0.70 on "warrant to purchase" -- ordinary
        equity-issuance vocabulary, used correctly, by a document that lends
        nothing. It has no Events of Default, so the guard happens to stop it.

        Elmet's Investor Rights Agreement with the US Department of War does
        classify, as abl_revolver at 0.70, on a "Borrowing Base" it defines
        for a facility nobody has yet agreed to: "with respect to borrowings
        under a credit facility with lenders ... the aggregate lending value
        to be ascribed to the assets". Eligible accounts, zero. Lender, four
        times, all hypothetical. It has five Events of Default, because an
        investor rights agreement has defaults like any contract, so the guard
        admits it. That is the corpus's fourth silent error and its first on
        the held-out side, recorded and deliberately not repaired there.

      Air T's promissory note is the same admission without the harm: six
      Events of Default, no archetype vocabulary, so it declines on a
      different test than the one that lets it through. And the floor of two
      is wrong in the other direction on three real agreements -- nScale's
      Amendment No. 3, Vivid Seats' Amendment No. 7 and Horizon's Note Funding
      Agreement each say "Event of Default" once. None is currently harmed,
      because each declines on vocabulary too; Horizon's margin is nine
      references to a borrowing base wide.

      So the guard buys a great deal and its floor is not the thing doing the
      buying. What it establishes is that a document with no defaults at all
      is not an agreement, and that is worth keeping. What it cannot
      establish -- whose facility the credit vocabulary describes -- is the
      same question the suppression veto answers field by field, and the
      classifier does not ask it.
    remedy: >
      set JEV_API_KEY and refit thresholds; they are tagged per backend. This
      one will not yield to more keywords -- the measurement above is the
      argument for not trying.

  - id: ANTHROPIC_API
    families: [F01_integrity, F09_definitional_depth, F11_layout]
    status: partially_lifted
    reason: >
      ANTHROPIC_API_KEY is not configured, so no live model pass has ever run.
      What has run is one reading, made by hand and checked in: a reader read
      Essential Properties' Eighth Amendment end to end, wrote 24 extractions
      with a verbatim quote each into
      credit_extract/extract/recordings/, and --backend recorded replays them
      through the identical path -- same quote location, same reconciliation,
      same validators, same statuses.
    consequence: >
      Two different things were unknown here and only one of them still is.

      What is now known is that the machinery downstream of extraction was not
      ready for a model tier, because nothing had ever fed it one. The first
      replay crashed the pipeline outright: three registry fields are booleans,
      a bool is an int in Python, Decimal("False") raises, and no run had ever
      populated one. Behind that: a leverage covenant written as "60%" against
      a ratio-typed field was coerced to None and then reported as "the
      extractor probably missed it" on a section the extractor had quoted
      correctly; reconciliation flattened every valueless candidate to
      "produced no value", discarding the span it cited; the review queue
      printed "closing_date = 2019-11-26" next to status conflicted on a field
      with eleven candidates at equal weight; and the text pricing-grid reader
      was naming the last column of a four-column investment-grade grid the
      Eurodollar margin, putting a base rate spread of 0.550% into a
      criticality-5 field at 0.93 confidence, where the answer is 1.550%. All
      five are fixed and all five have regression tests.

      On the same 19 assertions the deterministic tier passes 10 and the
      replay passes 17, with no silent error either way. That number is NOT
      model recall and must not be quoted as one: the same reader wrote the
      reading and the labels, so the agreement between them is
      self-consistency. What it measures is whether correct extractions with
      correct citations survive to a correct record, and the answer before
      this week was that they did not.

      A second reading, of Aspen Technology's bilateral facility, found four
      more and needed no labels for any of them: a heading style that left one
      section detected out of 198 and every cross-reference in the document
      unresolvable; a money parser that read "1.250% of the initial principal
      amount" as one dollar twenty-five; an F01 invariant that had outgrown
      its own premise and was calling an evidenced absence a defect; and the
      targeted re-read at tier 4, which the ladder has always described and no
      caller had ever supplied, so it had never executed on any document.
      On that document's twelve assertions the deterministic tier passes
      8 and the checked-in reading passes 12.

      What is still unknown is whether a model produces those extractions.
      Recall on a live pass remains unmeasured, and the orphan sweep is still
      carrying weight a real extractor would take off it -- tier 4 now runs
      and, under the deterministic backend, recovers nothing on any document
      tried, which is a statement about the pattern set rather than about the
      tier.
    remedy: >
      Run with --backend anthropic and ANTHROPIC_API_KEY, or --backend vercel
      and AI_GATEWAY_API_KEY, against the documents that already carry both
      labels and a recording, so the live pass can be compared with a reading
      rather than only with the rules.

      The two are the same tier over different routes: Vercel's AI Gateway
      speaks the Messages API at ai-gateway.vercel.sh, takes the x-api-key
      header the SDK already sends, and supports output_config.format and
      output_config.effort, so the prompt, the schema and the failure handling
      are byte for byte the ones the direct route uses. What differs is the
      base URL, the credential and a creator-first model id
      (anthropic/claude-opus-5), all of which live on the Route object.

      Neither route has been exercised from this environment and the gateway
      route cannot be: api.anthropic.com needs a key, and ai-gateway.vercel.sh
      is refused by the egress proxy here as vercel.com is. What is tested is
      everything decidable without the network -- that the model id is
      prefixed once and not twice, that it is stripped again before pricing so
      an Opus run through the gateway is not costed at the fallback rate, that
      the gateway does not pick up an Anthropic key and send it somewhere
      Anthropic is not, that a missing credential fails before the first chunk
      rather than a thousand chunks in, and that the route decides where a
      request goes and never what it says. The first live call is still a
      first live call.

  - id: FPML_SCHEMAS
    families: [F06_structure, F07_benchmark]
    status: partially_lifted
    reason: >
      fpml.org serves the schemas behind an authenticated session, so the
      bytes come from a pinned commit of a public mirror
      (rosetta-models/rune-fpml) rather than from ISDA. Three schemas are
      recorded with their SHA-256, and `gen_fpml.py --drift` reproduces the
      checked-in index from them byte for byte.
    consequence: >
      What was lifted is the hand-mapping: the 40 element names this
      repository binds to are no longer invented, all 40 are declared in the
      pinned schemas, and fpml() raises on a name that is not. A second gap
      has closed since: those names sat on a Facility model that nothing ever
      constructed, so zero of the 40 were populated by any run the project had
      made. models/export.py builds one now, and only from settled fields --
      an external_reference is withheld with its reason rather than exported
      as None, because FpML has no element for "this is real and lives
      elsewhere" and None in that model reads as a term. On Essential
      Properties the deterministic tier exports no facility at all and the
      checked-in reading exports three, with 20 elements populated and 58
      withheld. Two things
      stay unverified, and they are not small. The pin makes the bytes
      reproducible, not authentic -- nothing here checks them against ISDA,
      so a mirror that diverged before the pinned commit would be indexed
      without complaint. And the check is a check of names: it says
      spreadAdjustment is declared, not that it means the credit spread
      adjustment a SOFR facility quotes, nor that it is legal where the
      mapping puts it. FpML declares the same name in more than one scope --
      delayedDraw is both a boolean on a term loan and a facility element --
      and the index merges them, so a name resolving proves less than it
      looks like it proves. The documentation each mapped element carries is
      in the index and was read once, by hand; nothing re-reads it.
    remedy: >
      Fetch the schemas from fpml.org with a session and compare the hashes,
      which settles authenticity. Position and meaning need the generated
      bindings -- `gen_fpml.py --generate` runs xsdata over the loan schema --
      so that a mapping to an element that cannot appear there fails to
      compile rather than passing a name check.
