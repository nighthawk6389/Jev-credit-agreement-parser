# Tier 2 assertions: Athene Holding Ltd. / Citibank, N.A., Credit Agreement
# dated as of June 26, 2026, filed 2026-08-10 by Athene Holding Ltd. as
# Exhibit 10.1.
#
# Out of sample: harvested from EDGAR after the fifth pass and labelled before
# the pipeline ran on it. An original five-year revolving credit agreement (no
# swingline, letters of credit or term loan) with four co-Borrowers led by
# Athene Holding Ltd. (AHL), priced on a five-level grid keyed to the Fitch
# and S&P ratings of AHL. Schedule 2.01 is not printed, so the size comes from
# the Aggregate Commitments definition. The Effective Date is event-defined,
# so closing_date is not labelled.

document: ig_athene_2026
corpus_name: IG_athene-holding-ltd_2026-08-10_0001527469-26-000056_q22026exhibit101
source: real
tier: 2

assertions:

  - id: ath_borrower_legal_name
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: borrower.legal_name
    expect: "ATHENE HOLDING LTD."
    note: >
      'is entered into as of June 26, 2026 among ATHENE HOLDING LTD., a
      Delaware corporation'

      The preamble names four Borrowers, collectively the Borrowers, and
      Athene Holding Ltd. (AHL) is named first, ahead of Athene Annuity Re
      Ltd., Athene Life Re Ltd. and Athene USA Corporation. The period after
      Ltd is part of the name as written.

  - id: ath_administrative_agent
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: administrative_agent.legal_name
    expect: "CITIBANK, N.A."
    note: >
      'and CITIBANK, N.A., as Administrative Agent.'

      The end of the preamble. The definition uses the short name (the
      Administrative Agent means Citibank in its capacity as administrative
      agent) and Citibank is defined as Citibank, N.A., so the legal name is
      the preamble one. Citibank, N.A. is also a Lender and a Joint Lead
      Arranger; the seven Syndication Agents are a different role.

  - id: ath_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      'SHALL BE GOVERNED BY, AND CONSTRUED IN ACCORDANCE WITH, THE LAW OF THE
      STATE OF NEW YORK'

      Section 10.14(a), covering this Agreement and the other Loan Documents.
      Several Borrowers are Bermuda exempted companies, but that is their
      place of incorporation, not the governing law.

  - id: ath_revolver_commitment
    family: F06_structure
    member: delayed_draw_multi_tranche
    kind: field_value
    target: revolver.commitment
    expect: "$1,750,000,000"
    note: >
      'As of the date hereof, the Aggregate Commitments equal $1,750,000,000.'

      The definition of Aggregate Commitments; a single revolving facility.
      Schedule 2.01, which carries the Commitment of each Lender, is not
      printed in the filing. Rejected: the accordion ceiling in Section 2.04(c),
      'immediately after giving effect to any Commitment Increase, the
      Aggregate Commitments shall not exceed $2,500,000,000', which is the
      most the facility may be increased to, not the commitment.

  - id: ath_maturity_date
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: revolver.maturity_date
    expect: 2031-06-26
    note: >
      'means June 26, 2031, as such date may be extended for any Lender
      pursuant to Section 2.13'

      The Commitment Termination Date. Section 2.05 ties the revolving loans
      to it: 'The Borrowers shall repay to the Lenders on the Commitment
      Termination Date the aggregate principal amount of Loans outstanding on
      such date'. Section 2.13 lets AHL ask, on no more than two occasions,
      for one-year extensions that each Lender grants in its sole discretion;
      that is conditional, so the date as it stands is labelled. June 26, 2031
      is a Thursday, so the preceding-Business-Day proviso does not move it.

  - id: ath_margin_top_level
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "1.500%"
    note: >
      'Pricing Level | Debt Rating | SOFR Rate+ | Base Rate+ | Commitment Fee'

      The Applicable Rate grid has five Pricing Levels keyed to the Debt
      Ratings of AHL; the SOFR Rate column runs from 0.875% at Level 1 to
      1.500% at Level 5, the row printed as '5 | < BBB+ | 1.500% | 0.500% |
      0.175%', which also applies when AHL has no Debt Rating. Rejected: the
      0.500% Base Rate margin in the same row, the 0.175% commitment fee, and
      the extra 2.00% per annum of the Default Rate.

  - id: ath_floor_zero
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.00%"
    note: >
      'if Term SOFR as so determined shall ever be less than the Floor, then
      Term SOFR shall be deemed to be the Floor'

      The proviso closing the Term SOFR definition, and Floor 'means a rate
      of interest equal to 0%'. A zero floor on the benchmark itself; the same
      Floor also bounds any Benchmark Replacement.

  - id: ath_commitment_fee
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.175%"
    note: >
      'a commitment fee equal to the Applicable Rate times the actual daily
      amount by which the Aggregate Commitments exceed the'

      Section 2.07(a): a fee on the unused amount (Aggregate Commitments less
      the Outstanding Amount), priced off the Commitment Fee column of the
      ratings grid, which runs from 0.070% at Pricing Level 1 to 0.175% at
      Pricing Level 5. There is no facility fee. The other fees in Section
      2.07(b) are the arranger fees in the Fee Letter and fees separately
      agreed with the Lenders, which carry no rate here.

  - id: ath_debt_to_cap_covenant
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: financial_covenant.level
    expect: "40%"
    note: >
      'The Borrowers shall not permit the Consolidated Debt to Capitalization
      Ratio of AHL and its Subsidiaries to be greater than 40%'

      Section 7.06(b), tested as of the last day of each fiscal quarter, with
      no step-up. Rejected: the other limb, Section 7.06(a), a minimum
      Consolidated Net Worth of $22,059,963,000, which is a net worth floor,
      not a leverage ratio; and the 25.0% Consolidated Debt to Capitalization
      Ratio in the definition of ACRA Debt, which is a condition on a debt
      category, not the covenant.
