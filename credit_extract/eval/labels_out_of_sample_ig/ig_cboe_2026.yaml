# Tier 2 assertions: Cboe Global Markets, Inc. / Bank of America, N.A., Third
# Amended and Restated Credit Agreement dated as of July 24, 2026, filed
# 2026-07-28 by Cboe Global Markets, Inc. as Exhibit 10.1.
#
# Out of sample: harvested from EDGAR after the fifth pass and labelled before
# the pipeline ran on it. An executed third amendment and restatement of the
# February 25, 2022 Second Amended and Restated Credit Agreement, signed and
# with Schedule 2.01 printed. One $400,000,000 multicurrency revolving facility
# (Dollars, Euro and Sterling, with a $25,000,000 swing line inside it) for the
# Company and any Designated Borrowers it later adds, none of which is named;
# priced off the S&P and Moody's ratings with an unused commitment fee. The
# restatement keeps the size and extends the maturity. The Closing Date is
# defined by the Section 4.01 conditions, so no closing date is labelled.

document: ig_cboe_2026
corpus_name: IG_cboe-global-markets-inc_2026-07-28_0001104659-26-087625_tm2621346d1_10-1
source: real
tier: 2

assertions:

  - id: cboe_borrower_legal_name
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: borrower.legal_name
    expect: "CBOE GLOBAL MARKETS, INC."
    note: >
      'is entered into as of July 24, 2026, by and among CBOE GLOBAL MARKETS,
      INC., a Delaware corporation'

      The preamble defines it as the Company, and Borrower includes the Company
      and any Designated Borrower added under Section 2.15 ('for the avoidance
      of doubt, shall always include the Company'). No Designated Borrower is
      named, so the Company is the borrower named first.

  - id: cboe_administrative_agent
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: administrative_agent.legal_name
    expect: "BANK OF AMERICA, N.A."
    note: >
      'and BANK OF AMERICA, N.A., as Administrative Agent and as Swing Line
      Lender'

      The preamble. The definition uses the short name ('means Bank of America
      (or any of its designated branch offices or affiliates) in its capacity
      as administrative agent'). BofA Securities, Inc. is the arranger and the
      seven banks below it are syndication agents.

  - id: cboe_governing_law
    family: F01_integrity
    member: undefined_term_used
    kind: field_value
    target: facility.governing_law
    expect: "New York"
    note: >
      'SHALL BE GOVERNED BY, AND CONSTRUED IN ACCORDANCE WITH, THE LAW OF THE
      STATE OF NEW YORK'

      Section 11.14(a), covering this Agreement and the other Loan Documents.

  - id: cboe_revolver_commitment
    family: F06_structure
    member: delayed_draw_multi_tranche
    kind: field_value
    target: revolver.commitment
    expect: "$400,000,000"
    note: >
      'The Toronto-Dominion Bank, New York Branch | | $ | 48,000,000.00 | | |
      | 12.000000000 | % Total | | $ | 400,000,000.00'

      The total line of Schedule 2.01; Aggregate Commitments means the
      Commitments of all the Lenders, each the amount opposite its name on
      that schedule. One revolving facility, no term loan. The recital gives
      the same figure for the Existing Credit Agreement ('in an aggregate
      principal amount not to exceed $400,000,000'), so the size did not
      change. Near misses: the Section 2.13 accordion ('request an increase in
      the Aggregate Commitments by an aggregate amount (for all such requests)
      not exceeding $200,000,000') and the $25,000,000 Swing Line Sublimit,
      which is part of the Aggregate Commitments.

  - id: cboe_maturity_date
    family: F09_definitional_depth
    member: depth_4_plus_closure
    kind: field_value
    target: revolver.maturity_date
    expect: 2031-07-24
    note: >
      'Maturity Date " means July 24, 2031; provided, however, that if such
      date is not a Business Day, the Maturity Date shall be the next
      immediately preceding Business Day.'

      July 24, 2031 is a Thursday, so the roll does not move it, and the
      agreement has no extension option; the restatement itself was made to
      extend the maturity of the Existing Credit Agreement.

  - id: cboe_margin_top_level
    family: F07_benchmark
    member: pricing_grid_stepdowns
    kind: field_value
    target: applicable_margin.eurodollar_top_level_pct
    expect: "1.250%"
    note: >
      'Term SOFR Loans and Alternative Currency Loans | Base Rate Loans'

      Column headers of the five-level ratings grid in the Applicable Rate
      definition, after the Commitment Fee column. The lowest rating level
      reads '5 | < BBB / Baa2 | 0.175% | 1.250% | 0.250%' and Level 1 is
      0.750%, so the top Term SOFR margin is 1.250%. The 0.250% is the Base
      Rate margin and the 0.175% the commitment fee; Pricing Level 5 also
      applies if the Company has no rating.

  - id: cboe_floor_zero
    family: F07_benchmark
    member: floor_on_base_vs_all_in
    kind: field_value
    target: libor_floor_pct
    expect: "0.00%"
    note: >
      'would otherwise be less than zero, Term SOFR shall be deemed to be zero
      for purposes of this Agreement'

      The proviso closing the Term SOFR definition, a zero floor on the
      benchmark itself. The Alternative Currency Daily Rate and Term Rate
      (SONIA and Euribor) and any Successor Rate carry the same zero floor, so
      every benchmark in the agreement is floored at zero.

  - id: cboe_commitment_fee
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: commitment_fee_pct
    expect: "0.175%"
    note: >
      'a commitment fee equal to the Applicable Rate times the actual daily
      amount by which the Aggregate Commitments exceed the Outstanding Amount
      of Committed Loans'

      Section 2.08(a): a fee on unused commitments (swing line loans do not
      count as usage), read off the Commitment Fee column of the ratings grid,
      from 0.075% at Level 1 to 0.175% at Level 5. There is no facility fee;
      Section 2.08(b) covers only the fees of BofA Securities and the
      Administrative Agent in the Fee Letter dated May 20, 2026 and any fees
      separately agreed with the Arranger and the Lenders, not this one.

  - id: cboe_leverage_covenant
    family: F10_conditionality
    member: time_and_leverage_stepdown
    kind: field_value
    target: financial_covenant.level
    expect: "3.50 to 1.00"
    note: >
      'Permit the Consolidated Leverage Ratio, determined as of the end of any
      fiscal quarter of the Company, to be greater than 3.50 to 1.00'

      Section 7.04(a); Consolidated Leverage Ratio is Consolidated Funded
      Indebtedness to Consolidated EBITDA. On a Qualified Acquisition the
      Company may raise it 'to 4.25 to 1.00 on one occasion and 4.00 to 1.00
      on another occasion' for four fiscal quarters each, at most twice; the
      base level is labelled. Section 7.04(b) adds a minimum Consolidated
      Interest Coverage Ratio of 4.00 to 1.00, which is a floor, not the
      leverage cap.
