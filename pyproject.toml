[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-extract"
version = "0.1.0"
description = "Credit agreement -> standards-grounded structured loan data model, with adversarial validation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
credit-extract = "credit_extract.cli:main"

[tool.setuptools.packages.find]
include = ["credit_extract*"]

[tool.setuptools.package-data]
credit_extract = ["extract/prompts/*.txt", "eval/gold/*.json", "eval/gold/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:credit_extract.*"]
