[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-extract"
version = "0.1.0"
description = "Credit agreement -> standards-grounded structured loan data model, with adversarial validation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    # The trap-family and blind-spot registers are YAML and are read on every
    # run: the pipeline prints the blind-spot register in every report, so this
    # is a runtime dependency rather than a dev one.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
credit-extract = "credit_extract.cli:main"

[tool.setuptools.packages.find]
include = ["credit_extract*"]

[tool.setuptools.package-data]
credit_extract = [
    "extract/prompts/*.txt",
    "eval/gold/*.json",
    "eval/gold/*.html",
    # The registers and the Tier 2 labels. Without these an installed wheel
    # imports cleanly and then fails on the first extraction, because every
    # report reads the blind-spot register.
    "eval/*.yaml",
    "eval/labels/*.yaml",
    # The FIBO and ACTUS snapshots. fibo() and actus_term() raise on a term
    # that is not in them, which is the whole point -- an invented URI cannot
    # ship -- so without these files every extraction raises instead.
    "models/vendored/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:credit_extract.*"]
markers = [
    "slow: regenerates part of the gold corpus and reruns the pipeline over it",
]
